<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Speech Sounds — Practice</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Speech Sounds">
<meta name="theme-color" content="#1bb6a6">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%231bb6a6'/%3E%3Ctext x='50%25' y='64%25' font-size='96' text-anchor='middle' fill='white' font-family='Arial'%3E%F0%9F%97%A3%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
  :root{ --accent:#1bb6a6; }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    font-family:-apple-system,"SF Pro Rounded",BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    color:#16323a; background:linear-gradient(170deg,#a8ecdf 0%, #d7f5ee 45%, #fff6da 100%);
    background-attachment:fixed; height:100%; overflow:hidden; user-select:none; -webkit-user-select:none;
  }
  #app{ height:100vh; height:100svh; height:100dvh; max-width:640px; margin:0 auto; position:relative;
    padding:env(safe-area-inset-top) 18px calc(18px + env(safe-area-inset-bottom)); }
  .screen{ position:absolute; inset:0; display:none; flex-direction:column; align-items:center;
    padding:clamp(18px,5vw,34px); overflow:auto; }
  .screen.on{ display:flex; }

  #backToMenu{ position:fixed; top:calc(env(safe-area-inset-top,0px) + 8px); left:8px; z-index:20;
    font:700 14px inherit; color:#fff; background:rgba(0,0,0,.32); padding:7px 13px; border-radius:999px; text-decoration:none; }
  #backToMenu:active{ background:rgba(0,0,0,.5); }

  .btn{ border:none; cursor:pointer; font-family:inherit; font-weight:900; color:#fff;
    border-radius:999px; box-shadow:0 6px 0 rgba(0,0,0,.14); transition:transform .08s, box-shadow .08s; }
  .btn:active{ transform:translateY(3px); box-shadow:0 3px 0 rgba(0,0,0,.14); }
  .link-btn{ background:none; border:none; color:#2d6a72; font-weight:800; font-size:15px; cursor:pointer;
    padding:10px; margin-top:6px; text-decoration:underline; }

  /* ---------- start: sound picker ---------- */
  #start, #ready{ justify-content:center; }
  .hero{ font-size:clamp(44px,14vw,76px); line-height:1; }
  .hdr{ width:auto; max-height:min(32vh,220px); border-radius:20px; border:4px solid #fff;
    box-shadow:0 10px 24px rgba(40,60,80,.22); margin-bottom:2px; }
  h1{ font-size:clamp(26px,7vw,40px); font-weight:900; margin-top:6px; text-align:center; }
  .sub{ font-size:clamp(15px,4vw,19px); font-weight:700; color:#3c5a62; text-align:center; margin-top:8px; }
  .sound-grid{ width:100%; margin-top:22px; display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; }
  .sound-card{ position:relative; background:#fff; border-radius:22px; padding:18px 14px 16px; text-align:center;
    box-shadow:0 8px 20px rgba(40,60,80,.14); border:3px solid #fff; cursor:pointer;
    width:100%; font-family:inherit; color:inherit; -webkit-appearance:none; appearance:none;
    transition:transform .1s, box-shadow .1s; }
  .sound-card:active{ transform:translateY(2px) scale(.99); }
  .sound-card .letter{ font-size:clamp(46px,13vw,66px); font-weight:900; line-height:1; }
  .sound-card .nm{ font-size:15px; font-weight:800; color:#3c5a62; margin-top:4px; }
  .sound-card .go{ display:inline-block; margin-top:12px; color:#fff; font-weight:900; font-size:15px;
    padding:9px 20px; border-radius:999px; }
  .sound-card.soon{ background:rgba(255,255,255,.5); border:3px dashed #b9d6ce; cursor:default; box-shadow:none; color:#6f8a86; }
  .sound-card.soon .letter{ color:#9fc0ba; } .sound-card.soon .nm{ color:#7d9a95; }
  .badge{ display:inline-block; margin-top:12px; font-weight:800; font-size:13px; color:#5f8580;
    background:#e3f3ef; padding:8px 14px; border-radius:999px; }

  /* ---------- ready (per-sound intro) ---------- */
  .big-letter{ font-size:clamp(70px,22vw,130px); font-weight:900; color:var(--accent); line-height:1;
    text-shadow:0 6px 0 rgba(0,0,0,.06); }
  .tip{ margin-top:16px; background:#fff; border:3px solid #ffe08a; border-radius:18px; padding:14px 18px;
    font-size:clamp(15px,3.8vw,18px); font-weight:700; color:#5a4a10; text-align:center; max-width:34ch;
    box-shadow:0 8px 20px rgba(40,60,80,.12); }
  .start-btn{ margin-top:26px; background:var(--accent); font-size:clamp(20px,5.5vw,26px); padding:18px 46px; }

  /* ---------- play ---------- */
  #play, #end{ justify-content:flex-start; }
  .topbar{ width:100%; display:flex; align-items:center; gap:10px; margin-top:6px; }
  .bar{ flex:1; height:12px; background:rgba(0,0,0,.10); border-radius:99px; overflow:hidden; }
  .bar > i{ display:block; height:100%; width:0; background:var(--accent); border-radius:99px; transition:width .25s; }
  .count{ font-weight:800; font-size:15px; color:#2d4a52; min-width:62px; text-align:right; }
  .card{ flex:1; width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; }
  .pic{ font-size:clamp(110px,34vw,210px); line-height:1; filter:drop-shadow(0 10px 16px rgba(0,0,0,.14)); }
  .pic img{ width:clamp(140px,40vw,240px); height:clamp(140px,40vw,240px); object-fit:contain;
    filter:drop-shadow(0 10px 16px rgba(0,0,0,.14)); }
  .word{ font-size:clamp(40px,12vw,80px); font-weight:900; letter-spacing:.5px; }
  .word .hl{ color:var(--accent); }
  .hear{ margin-top:4px; background:#fff; border:2px solid #cfe9e3; color:var(--accent); font-weight:800;
    font-size:16px; padding:8px 18px; border-radius:999px; cursor:pointer; }
  .choices{ width:100%; display:grid; grid-template-columns:1fr 1fr; gap:16px; padding-bottom:6px; }
  .choice{ font-size:clamp(20px,6vw,28px); padding:22px 10px; }
  .yes{ background:#27c06a; } .no{ background:#ff7a59; }
  .choice .ic{ font-size:1.3em; display:block; }

  /* ---------- end ---------- */
  .score{ font-size:clamp(56px,18vw,108px); font-weight:900; color:var(--accent); line-height:1; margin-top:14px; }
  .score small{ font-size:.4em; color:#3c5a62; }
  .stars{ font-size:clamp(30px,9vw,46px); margin:6px 0; letter-spacing:6px; }
  .msg{ font-size:clamp(17px,4.6vw,22px); font-weight:800; text-align:center; }
  .again-list{ margin-top:14px; background:#fff; border-radius:18px; padding:14px 18px; max-width:36ch;
    box-shadow:0 8px 20px rgba(40,60,80,.12); }
  .again-list h3{ font-size:14px; color:#7a6a2a; text-transform:uppercase; letter-spacing:.5px; }
  .again-list p{ font-size:clamp(16px,4.4vw,20px); font-weight:800; color:#16323a; margin-top:6px; line-height:1.5; }
  .play-again{ margin-top:20px; background:var(--accent); font-size:clamp(19px,5.2vw,24px); padding:16px 40px; }
</style>
</head>

<script>
"use strict";

/* =========================================================================
   SOUNDS — add a new sound over time by copying the L block below.
   Each sound has its own word list. For each word:
       { w:"word", e:"😀" }                     ← emoji picture
       { w:"word", img:"https://… or data:…" }  ← a real image (url or data URI)
   ========================================================================= */
const SOUNDS = [
  {
    id:"L", letter:"L", name:"The Singing Sound", color:"#1bb6a6",
    tip:'👅 Tongue peeking between your teeth… and <b>siiing</b> <b style="color:#e8553d">Lllll</b>!',
    words:[
      { w:"lizard", e:"🦎" }, { w:"lime", e:"🍋‍🟩" }, { w:"lock", e:"🔒" }, { w:"lips", e:"👄" },
      { w:"lamp", e:"💡" }, { w:"lollipop", e:"🍭" }, { w:"laundry", e:"🧺" }, { w:"ladybug", e:"🐞" },
      { w:"leaf", e:"🍃" }, { w:"letter", e:"✉️" }, { w:"love", e:"❤️" }, { w:"lemon", e:"🍋" },
      { w:"lotion", e:"🧴" }, { w:"llama", e:"🦙" }, { w:"lightning", e:"⚡" }, { w:"lake", e:"🏞️" },

  /* ---- Template for the next sound (delete this comment, fill it in) ----
  {
    id:"S", letter:"S", name:"The Snake Sound", color:"#6c8cff",

  },
  ------------------------------------------------------------------------ */

const ROUND_SIZE = 20;   // how many pictures to show each round

// ---------- helpers ----------
const $ = id => document.getElementById(id);
function show(name){ document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on", s.id===name)); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function wordHTML(w){ return '<span class="hl">'+w[0]+'</span>'+w.slice(1); }

// ---------- sounds ----------
let actx=null;
function audio(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(actx && actx.state==="suspended"){ try{ actx.resume(); }catch(e){} } return actx; }
function tone(freq,dur,type,vol,when){ const a=audio(); if(!a) return;
  try{ const o=a.createOscillator(), g=a.createGain(); o.type=type||"sine"; o.frequency.value=freq;
    g.gain.value=vol||0.07; o.connect(g); g.connect(a.destination); const t=a.currentTime+(when||0);
    o.start(t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.stop(t+dur+0.02);
  }catch(e){} }
function sYes(){ tone(660,0.12,"sine",0.08,0); tone(990,0.16,"sine",0.08,0.10); }
function sNext(){ tone(330,0.10,"sine",0.05,0); }
function sFanfare(){ [523,659,784,1047].forEach((f,i)=>tone(f,0.18,"triangle",0.07,i*0.10)); }
function speak(w){ try{ const u=new SpeechSynthesisUtterance(w); u.rate=0.85; u.pitch=1.05; u.lang="en-US";
  speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){} }

// ---------- build the picker ----------
(function buildPicker(){
  const grid=$("soundGrid");
  SOUNDS.forEach((s,i)=>{
    const c=document.createElement("button");
    c.type="button";
    c.className="sound-card";
    c.innerHTML='<div class="letter" style="color:'+s.color+'">'+s.letter+'</div>'+
                '<div class="nm">'+s.name+'</div>'+
                '<span class="go" style="background:'+s.color+'">Practice ▶</span>';
    c.onclick=()=>openSound(i);
    grid.appendChild(c);
  });
  const soon=document.createElement("div");
  soon.className="sound-card soon";
  soon.innerHTML='<div class="letter">+</div><div class="nm">More sounds</div><span class="badge">🔜 coming soon</span>';
  grid.appendChild(soon);
})();

// ---------- game state ----------
let sound=null, deck=[], idx=0, correct=0, missed=[];

function openSound(i){
  sound=SOUNDS[i];
  document.documentElement.style.setProperty("--accent", sound.color);
  $("readyLetter").textContent=sound.letter;
  $("readyName").textContent=sound.name;
  show("ready");
}
function startRound(){
  audio();
  deck = shuffle(sound.words).slice(0, Math.min(ROUND_SIZE, sound.words.length));
  idx=0; correct=0; missed=[];
  show("play"); render();
}
function render(){
  const item=deck[idx];
  if(item.img){ $("pic").innerHTML='<img src="'+item.img+'" alt="'+item.w+'">'; }
  else { $("pic").textContent=item.e || "🔤"; }
  $("word").innerHTML=wordHTML(item.w);
  $("count").textContent=(idx+1)+" / "+deck.length;
  $("barFill").style.width=(idx/deck.length*100)+"%";
}
function answer(ok){
  const item=deck[idx];
  if(ok){ correct++; sYes(); } else { missed.push(item.w); sNext(); }
  idx++; $("barFill").style.width=(idx/deck.length*100)+"%";
  if(idx>=deck.length) endRound(); else render();
}
function endRound(){
  show("end");
  const total=deck.length, pct=correct/total;
  $("scoreNum").innerHTML=correct+'<small>/'+total+'</small>';
  $("stars").textContent = pct>=0.9?"⭐⭐⭐" : pct>=0.6?"⭐⭐" : "⭐";
  $("endTitle").textContent = pct>=0.9?"Amazing! 🎉" : pct>=0.6?"Great job! 🎵" : "Nice practicing! 💪";
  $("endMsg").textContent = "You said "+correct+" of "+total+" all by yourself!";
  if(missed.length){ $("againWrap").style.display="block"; $("againWords").textContent=missed.join(", "); }
  else { $("againWrap").style.display="none"; }
  sFanfare();
}

// ---------- wire up ----------
$("startBtn").onclick=startRound;
$("againBtn").onclick=startRound;
$("pickAnother").onclick=()=>show("start");
$("chooseSound").onclick=()=>show("start");
$("yesBtn").onclick=()=>answer(true);
$("noBtn").onclick=()=>answer(false);
$("hearBtn").onclick=()=>speak(deck[idx].w);
window.addEventListener("keydown",(e)=>{
  if($("play").classList.contains("on")){
    if(e.code==="ArrowRight"||e.code==="Space"){ e.preventDefault(); answer(true); }
    else if(e.code==="ArrowLeft"){ e.preventDefault(); answer(false); }
  } else if(e.code==="Enter" && $("ready").classList.contains("on")){ startRound(); }
});
</script>
</body>
</html>
