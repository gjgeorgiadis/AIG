<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1b2e">
<title>Alexander's Pup Pack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d1b2e; --deep:#12263f; --surface:#1a3350; --surface2:#244568; --bone:#f4ead6;
  --muted:#9fb6d0; --lime:#c6ff4a; --gold:#ffd24a; --sky:#49b6ff; --coral:#ff5c7a;
  --water:#49b6ff; --flame:#ff7a29; --dirt:#a9743f;
  --display:'Space Grotesk', system-ui, sans-serif; --mono:ui-monospace,'SF Mono',Menlo,monospace;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; height:100%; overscroll-behavior:none; }
body{ font-family:var(--display); color:var(--bone); position:fixed; inset:0; overflow:hidden;
  background:radial-gradient(1100px 700px at 50% -8%, #1d3a5c 0%, var(--ink) 62%) fixed, var(--ink); }
#app{ position:relative; height:100svh; height:100dvh; width:100%; max-width:560px; margin:0 auto;
  display:flex; flex-direction:column; overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
.screen{ position:absolute; inset:0; display:none; flex-direction:column;
  padding:clamp(14px,3.8vw,26px) clamp(14px,3.8vw,26px) calc(clamp(10px,2.8vw,18px) + env(safe-area-inset-bottom)); }
.screen.active{ display:flex; }
.eyebrow{ font-weight:600; letter-spacing:.22em; text-transform:uppercase; font-size:clamp(10px,2.7vw,12px);
  color:var(--muted); text-align:center; }
.btn{ font-family:var(--display); font-weight:700; font-size:clamp(16px,4.2vw,20px); color:var(--ink);
  background:var(--bone); border:none; border-radius:16px; padding:14px 18px; width:100%; cursor:pointer;
  box-shadow:0 6px 0 #b9ad94, 0 10px 22px #0007; }
.btn:active{ transform:translateY(4px); box-shadow:0 2px 0 #b9ad94; }
.btn.ghost{ background:var(--surface2); color:var(--bone); box-shadow:inset 0 0 0 1.5px #ffffff1c; }
.menu{ width:100%; max-width:340px; display:flex; flex-direction:column; gap:9px; margin:0 auto; }

/* ---------- home ---------- */
#home{ justify-content:center; align-items:center; gap:clamp(8px,1.8vh,14px); overflow-y:auto; }
.title{ line-height:.9; letter-spacing:-.03em; text-align:center; }
.title .small{ display:block; font-size:clamp(15px,4.6vw,22px); color:var(--muted); font-weight:600; letter-spacing:0; }
.title .big{ display:block; font-size:clamp(36px,12vw,62px); font-weight:700; }
.title .big b{ color:var(--sky); } .title .big i{ color:var(--gold); font-style:normal; }
/* wide photo so both Alexander and the pup fit; flex:none keeps it from being
   squashed when the home screen is tight on a small phone */
.alex{ width:min(80vw,300px); aspect-ratio:3/2; height:auto; flex:none;
  border-radius:20px; object-fit:cover;
  box-shadow:0 0 0 4px var(--surface2), 0 8px 22px #0009; }
.cap{ color:var(--muted); font-weight:600; font-size:clamp(12px,3.2vw,14px); text-align:center; }
.pups{ display:flex; flex-direction:column; gap:9px; width:100%; max-width:340px; }
.pupcard{ display:flex; align-items:center; gap:11px; border:none; border-radius:18px; padding:10px 13px;
  cursor:pointer; text-align:left; box-shadow:0 6px 0 #00000055, inset 0 0 0 1.5px #ffffff20; color:#0d1b2e; }
.pupcard:active{ transform:translateY(3px); box-shadow:0 3px 0 #00000055, inset 0 0 0 1.5px #ffffff20; }
.pupcard canvas{ width:clamp(46px,13vw,58px); height:clamp(46px,13vw,58px); flex:none; }
.pupcard .txt{ flex:1; min-width:0; }
.pupcard .nm{ display:block; font-weight:700; font-size:clamp(16px,4.4vw,19px); line-height:1.1; }
.pupcard .jb{ display:block; font-weight:600; font-size:clamp(11px,3vw,12.5px); opacity:.78; }
.pupcard .bs{ font-family:var(--mono); font-weight:700; font-size:clamp(11px,3vw,13px); opacity:.72; flex:none; }
.p-splash{ background:linear-gradient(150deg,#ff8f6b,#e8503f); }
.p-breeze{ background:linear-gradient(150deg,#8fdcff,#49b6ff); }
.p-digger{ background:linear-gradient(150deg,#ffd98a,#f0a92b); }
.diffrow{ display:flex; gap:8px; width:100%; max-width:340px; }
.diff{ flex:1; font-family:var(--display); font-weight:700; color:var(--ink); border:none; border-radius:14px;
  padding:10px 6px; cursor:pointer; box-shadow:0 4px 0 #b9ad94; font-size:clamp(13px,3.6vw,15px); background:#c9d6e6; opacity:.55; }
.diff.on{ opacity:1; background:var(--gold); }

/* ---------- game ---------- */
#game{ padding:calc(env(safe-area-inset-top) + 6px) 8px calc(env(safe-area-inset-bottom) + 8px); gap:6px; }
.hud{ display:flex; align-items:center; gap:7px; }
.iconbtn{ font-weight:700; font-size:15px; color:var(--bone); background:var(--surface); border:none;
  border-radius:11px; width:36px; height:36px; cursor:pointer; box-shadow:inset 0 0 0 1.5px #ffffff14; flex:none; }
.pill{ background:var(--surface); border-radius:11px; padding:4px 9px; box-shadow:inset 0 0 0 1.5px #ffffff10;
  text-align:center; flex:1; min-width:0; }
.pill .k{ display:block; color:var(--muted); font-weight:600; font-size:clamp(7px,2vw,9px);
  letter-spacing:.1em; text-transform:uppercase; }
.pill .v{ display:block; font-family:var(--mono); font-weight:700; font-size:clamp(13px,3.6vw,16px); line-height:1.15; }
.stage{ position:relative; flex:1; min-height:0; display:flex; align-items:center; justify-content:center; }
canvas#play{ border-radius:16px; display:block; touch-action:none; overscroll-behavior:none;
  box-shadow:0 12px 30px #000a, inset 0 0 0 1.5px #ffffff12; }
.tip{ position:absolute; left:50%; top:10px; transform:translateX(-50%); background:#0d1b2ecc; border-radius:12px;
  padding:7px 13px; font-weight:600; font-size:clamp(11px,3.1vw,13px); pointer-events:none;
  transition:opacity .4s; box-shadow:inset 0 0 0 1px #ffffff18; text-align:center; max-width:90%; }
.bigmsg{ position:absolute; left:50%; top:42%; transform:translate(-50%,-50%); font-weight:700;
  font-size:clamp(28px,9vw,48px); pointer-events:none; opacity:0; text-shadow:0 4px 18px #000c; }
.bigmsg.show{ animation:bm .9s ease-out; }
@keyframes bm{ 0%{opacity:0;transform:translate(-50%,-50%) scale(.6);} 22%{opacity:1;transform:translate(-50%,-50%) scale(1.1);}
  70%{opacity:1;} 100%{opacity:0;transform:translate(-50%,-50%) scale(1);} }

/* ---------- result ---------- */
#result{ justify-content:center; gap:10px; text-align:center; overflow-y:auto; }
.res-emoji{ font-size:clamp(38px,12vw,58px); line-height:1; }
.res-title{ font-weight:700; font-size:clamp(21px,6.2vw,31px); }
.res-sub{ color:var(--muted); font-weight:600; font-size:clamp(12px,3.3vw,14px); margin-top:-3px; }
.stars{ font-size:clamp(26px,8vw,36px); letter-spacing:4px; height:1.2em; }
.stats{ width:100%; max-width:320px; margin:0 auto; background:var(--surface); border-radius:15px; padding:9px 12px;
  box-shadow:inset 0 0 0 1.5px #ffffff10; }
.srow{ display:flex; justify-content:space-between; padding:3px 0; font-weight:600; font-size:clamp(12px,3.3vw,14px); }
.srow .k{ color:var(--muted); } .srow .v{ font-family:var(--mono); font-weight:700; }
.srow.tot{ border-top:1.5px solid #ffffff1a; margin-top:4px; padding-top:7px; font-size:clamp(14px,4vw,17px); }
.srow.tot .v{ color:var(--lime); }
#confetti{ position:absolute; inset:0; z-index:60; pointer-events:none; display:none; }
@media (min-width:600px){ #app{ height:96svh; margin-top:2svh; border-radius:32px; box-shadow:0 40px 120px #000a, inset 0 0 0 1px #ffffff0d; } }
#backToMenu{ position:fixed; top:calc(env(safe-area-inset-top,0px) + 8px); left:8px; z-index:90;
  font:700 14px var(--display,-apple-system,sans-serif); color:#fff; background:rgba(0,0,0,.5);
  padding:7px 13px; border-radius:999px; text-decoration:none; -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); }
#backToMenu:active{ background:rgba(0,0,0,.7); }
</style>
</head>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const app=$('app');
const SCREENS=['home','game','result'];
function show(n){ SCREENS.forEach(s=>$(s).classList.toggle('active',s===n)); app.dataset.screen=n; }
const at=s=>app.dataset.screen===s;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
let rng=Math.random;
const rnd=(a,b)=>a+rng()*(b-a);
const ri=n=>Math.floor(rng()*n);

/* ================= confetti ================= */
const cv=$('confetti'), cctx=cv.getContext('2d'); let parts=[], confRaf=null, confUntil=0;
function sizeCv(){ const r=app.getBoundingClientRect(); cv.width=r.width; cv.height=r.height; }
function burst(ms){
  sizeCv(); cv.style.display='block';
  const cols=['#ffd24a','#49b6ff','#c6ff4a','#f4ead6','#ff7a29'];
  for(let i=0;i<110;i++) parts.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.4,
    vx:(Math.random()-.5)*1.6, vy:2+Math.random()*3.2, s:6+Math.random()*9,
    rot:Math.random()*6.28, vr:(Math.random()-.5)*.34, c:cols[Math.floor(Math.random()*cols.length)]});
  confUntil=performance.now()+ms; if(!confRaf) confLoop();
}
function confLoop(){
  cctx.clearRect(0,0,cv.width,cv.height);
  for(const p of parts){ p.x+=p.vx; p.y+=p.vy; p.vy+=.045; p.rot+=p.vr;
    cctx.save(); cctx.translate(p.x,p.y); cctx.rotate(p.rot); cctx.fillStyle=p.c;
    cctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); cctx.restore(); }
  parts=parts.filter(p=>p.y<cv.height+40);
  if(performance.now()<confUntil||parts.length) confRaf=requestAnimationFrame(confLoop);
  else { confRaf=null; cctx.clearRect(0,0,cv.width,cv.height); cv.style.display='none'; }
}
function stopConfetti(){ parts=[]; if(confRaf){ cancelAnimationFrame(confRaf); confRaf=null; }
  cctx.clearRect(0,0,cv.width,cv.height); cv.style.display='none'; }

/* ================= pup art (original characters) ================= */
function oc(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
/* A side-view rescue pup: body, tail, head, floppy ear, snout, and a job cap. */
function makePup(S,fur,furDark,cap,capDark){
  const c=oc(S,S), g=c.getContext('2d');
  g.translate(S/2,S/2); const u=S/100;
  // tail
  g.strokeStyle=furDark; g.lineWidth=7*u; g.lineCap='round';
  g.beginPath(); g.moveTo(-26*u,4*u); g.quadraticCurveTo(-40*u,-4*u,-36*u,-18*u); g.stroke();
  // body
  const bg=g.createLinearGradient(0,-18*u,0,26*u);
  bg.addColorStop(0,fur); bg.addColorStop(1,furDark);
  g.fillStyle=bg;
  g.beginPath(); g.ellipse(-6*u,8*u,26*u,18*u,0,0,6.283); g.fill();
  // legs
  g.fillStyle=furDark;
  g.beginPath(); g.roundRect(-20*u,18*u,9*u,16*u,4*u); g.fill();
  g.beginPath(); g.roundRect(2*u,18*u,9*u,16*u,4*u); g.fill();
  // chest patch
  g.fillStyle='#fff7e6';
  g.beginPath(); g.ellipse(6*u,14*u,10*u,11*u,0,0,6.283); g.fill();
  // head
  const hg=g.createLinearGradient(0,-34*u,0,2*u);
  hg.addColorStop(0,fur); hg.addColorStop(1,furDark);
  g.fillStyle=hg;
  g.beginPath(); g.ellipse(18*u,-12*u,20*u,18*u,0,0,6.283); g.fill();
  // floppy ear
  g.fillStyle=furDark;
  g.beginPath(); g.ellipse(9*u,-14*u,7*u,14*u,0.25,0,6.283); g.fill();
  // snout
  g.fillStyle='#fff7e6';
  g.beginPath(); g.ellipse(32*u,-6*u,12*u,9*u,0,0,6.283); g.fill();
  g.fillStyle='#25303f';
  g.beginPath(); g.ellipse(41*u,-9*u,4.2*u,3.4*u,0,0,6.283); g.fill();
  // mouth
  g.strokeStyle='#25303f'; g.lineWidth=1.6*u;
  g.beginPath(); g.arc(35*u,-2*u,5*u,0.15,Math.PI-0.15); g.stroke();
  // eye
  g.fillStyle='#25303f';
  g.beginPath(); g.arc(26*u,-15*u,3.6*u,0,6.283); g.fill();
  g.fillStyle='#fff';
  g.beginPath(); g.arc(27.2*u,-16.4*u,1.3*u,0,6.283); g.fill();
  // collar + badge
  g.fillStyle=capDark;
  g.beginPath(); g.roundRect(8*u,-1*u,17*u,6*u,3*u); g.fill();
  g.fillStyle=cap;
  g.beginPath(); g.arc(17*u,2*u,6*u,0,6.283); g.fill();
  g.fillStyle='#fff';
  g.beginPath(); g.arc(17*u,2*u,2.4*u,0,6.283); g.fill();
  // cap
  g.fillStyle=cap;
  g.beginPath(); g.arc(19*u,-24*u,16*u,Math.PI,0); g.fill();
  g.beginPath(); g.roundRect(19*u,-26*u,22*u,5*u,2.5*u); g.fill();
  g.fillStyle=capDark;
  g.beginPath(); g.roundRect(3*u,-26*u,32*u,4*u,2*u); g.fill();
  return c;
}
const PUPS=[
  {id:'splash', name:'Splash', job:'Water Pup · put out the fires', cls:'p-splash',
   fur:'#f0a17f', furDark:'#c4614a', cap:'#e8503f', capDark:'#9c2f21',
   tip:'Touch the fire to spray water on it! Keep the house safe.'},
  {id:'breeze', name:'Breeze', job:'Sky Pup · fly and rescue kittens', cls:'p-breeze',
   fur:'#cfe9ff', furDark:'#7fb6dd', cap:'#49b6ff', capDark:'#1c6ea8',
   tip:'Hold your finger down to fly UP. Let go to come down. Grab the kittens!'},
  {id:'digger', name:'Digger', job:'Dig Pup · tunnel for bones', cls:'p-digger',
   fur:'#ffd08a', furDark:'#d08a2c', cap:'#f0a92b', capDark:'#9c6512',
   tip:'Slide your finger up and down to steer. Grab bones, dodge the rocks!'}
];
const ART={};
function buildArt(){
  if(ART.built) return; ART.built=true;
  for(const p of PUPS) ART[p.id]=makePup(200,p.fur,p.furDark,p.cap,p.capDark);
}

/* ================= difficulty ================= */
const DIFFS=[
  {name:'Pup mode', dur:60, lives:5,
   fireRate:2.6, fireGrow:.085, sprayR:.30, spread:.25,
   flyLives:5, flySpd:150, flyGap:.46, flyLift:1250, flyGrav:720, flyVmax:265, kitten:1.5,
   digSpd:190, digGap:[.58,.86], rockChance:.40, digSteer:1.0, mult:1},
  {name:'Daddy mode', dur:60, lives:3,
   fireRate:1.25, fireGrow:.155, sprayR:.20, spread:.55,
   flyLives:4, flySpd:250, flyGap:.42, flyLift:1500, flyGrav:880, flyVmax:300, kitten:1.1,
   digSpd:315, digGap:[.48,.74], rockChance:.50, digSteer:1.0, mult:2}
];
let D=DIFFS[0], diffIdx=0;

/* ================= shared game state ================= */
const play=$('play'), px=play.getContext('2d');
let W=0,H=0,DPR=1;
function fit(){
  const st=play.parentElement, w=st.clientWidth, h=st.clientHeight;
  if(!w||!h) return;
  DPR=Math.min(window.devicePixelRatio||1,2.5);
  play.style.width=w+'px'; play.style.height=h+'px';
  play.width=Math.round(w*DPR); play.height=Math.round(h*DPR);
  px.setTransform(DPR,0,0,DPR,0,0); W=w; H=h;
}
window.addEventListener('resize',()=>{ fit(); if(parts.length||confRaf) sizeCv(); });

let cur=null, score=0, lives=0, timeLeft=0, over=false, started=false, outcome=null;
let touch={x:0,y:0,down:false};
let patrol=null, patrolScore=0;
let fx=[];
function pop(x,y,txt,col){ fx.push({x,y,txt,col:col||'#f4ead6',a:1}); if(fx.length>14) fx.shift(); }
function bigMsg(t,c){ const el=$('bigmsg'); el.textContent=t; el.style.color=c||'#f4ead6';
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show'); }

/* ================= GAME 1 — Splash: aim the hose ================= */
const Splash={
  key:'splash', livesLabel:'House',
  init(){
    this.fires=[]; this.damage=0; this.tank=100; this.spawnT=1.0;
    this.aim=-0.6; this.spraying=false;
    this.windows=[];
    for(let r=0;r<3;r++) for(let c=0;c<4;c++) this.windows.push({wx:c,wy:r});
  },
  hx(){ return W*0.13; }, hy(){ return H*0.80; },
  winPos(w){ return { x:W*0.40+w.wx*(W*0.145), y:H*0.24+w.wy*(H*0.16) }; },
  spawn(){
    const free=this.windows.filter(w=>!this.fires.some(f=>f.w===w));
    if(!free.length) return;
    const w=free[ri(free.length)];
    const p=this.winPos(w);
    this.fires.push({w, x:p.x, y:p.y, heat:.25, ph:rnd(0,6.28)});
  },
  step(dt){
    // aim toward the finger
    if(touch.down){
      this.aim=Math.atan2(touch.y-this.hy(), touch.x-this.hx());
      this.spraying=this.tank>0;
    } else this.spraying=false;
    this.tank=clamp(this.tank + (this.spraying? -34*dt : 26*dt),0,100);
    // spawn fires
    this.spawnT-=dt;
    if(this.spawnT<=0){ this.spawnT=D.fireRate*rnd(.75,1.3); this.spawn(); }
    // fires grow, flare and spread
    for(let i=this.fires.length-1;i>=0;i--){
      const f=this.fires[i]; f.ph+=dt*6;
      f.heat+=D.fireGrow*dt;
      if(f.heat>=1){
        f.heat=.55; this.damage+=9;
        if(rng()<D.spread) this.spawn();
        pop(f.x,f.y-18,'🔥','#ff5c7a');
      }
      // water hits it?
      if(this.spraying){
        const a=Math.atan2(f.y-this.hy(), f.x-this.hx());
        let da=Math.abs(((a-this.aim+Math.PI*3)%(Math.PI*2))-Math.PI);
        if(da<D.sprayR){
          f.heat-=1.35*dt;
          if(f.heat<=0){ this.fires.splice(i,1); score++; pop(f.x,f.y-16,'+1','#c6ff4a'); }
        }
      }
    }
    lives=Math.max(0,Math.ceil((100-this.damage)/20));
    if(this.damage>=100){ over=true; outcome='lost'; }
  },
  draw(){
    // sky + ground
    let g=px.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#2a5c8f'); g.addColorStop(1,'#15304c'); px.fillStyle=g; px.fillRect(0,0,W,H);
    px.fillStyle='#2f6b34'; px.fillRect(0,H*0.84,W,H*0.16);
    // house
    const bx=W*0.33, by=H*0.16, bw=W*0.62, bh=H*0.68;
    px.fillStyle='#c9a06b'; px.fillRect(bx,by,bw,bh);
    px.fillStyle='#8a6941'; px.fillRect(bx,by,bw,bh*0.06);
    px.beginPath(); px.moveTo(bx-8,by); px.lineTo(bx+bw/2,by-H*0.10); px.lineTo(bx+bw+8,by); px.closePath();
    px.fillStyle='#a4442f'; px.fill();
    px.fillStyle='#6d4d2c'; px.fillRect(bx+bw*0.42,by+bh*0.72,bw*0.18,bh*0.28);
    for(const w of this.windows){
      const p=this.winPos(w);
      px.fillStyle='#2b3d55'; px.fillRect(p.x-W*0.045,p.y-H*0.045,W*0.09,H*0.09);
      px.strokeStyle='#e8dcc4'; px.lineWidth=2;
      px.strokeRect(p.x-W*0.045,p.y-H*0.045,W*0.09,H*0.09);
    }
    // fires
    for(const f of this.fires){
      const s=(0.7+f.heat*0.9)*(0.9+Math.sin(f.ph)*0.12);
      const r=W*0.05*s;
      const fg=px.createRadialGradient(f.x,f.y,1,f.x,f.y,r*2);
      fg.addColorStop(0,'rgba(255,190,60,.9)'); fg.addColorStop(.5,'rgba(255,110,30,.55)');
      fg.addColorStop(1,'rgba(255,60,0,0)');
      px.fillStyle=fg; px.beginPath(); px.arc(f.x,f.y,r*2,0,6.283); px.fill();
      px.font=Math.round(r*2.1)+'px system-ui,"Apple Color Emoji"';
      px.textAlign='center'; px.textBaseline='middle'; px.fillText('🔥',f.x,f.y);
    }
    // pup + hose
    const a=ART.splash, sz=W*0.20;
    px.drawImage(a,this.hx()-sz*0.62,this.hy()-sz*0.72,sz,sz);
    if(this.spraying){
      px.save(); px.translate(this.hx(),this.hy()); px.rotate(this.aim);
      const len=W*1.1;
      const wg=px.createLinearGradient(0,0,len,0);
      wg.addColorStop(0,'rgba(160,225,255,.95)'); wg.addColorStop(1,'rgba(90,190,255,0)');
      px.fillStyle=wg;
      px.beginPath(); px.moveTo(0,-W*0.012); px.lineTo(len,-len*Math.tan(D.sprayR));
      px.lineTo(len,len*Math.tan(D.sprayR)); px.lineTo(0,W*0.012); px.closePath(); px.fill();
      for(let i=0;i<8;i++){ const d=rnd(0.15,1)*len, sp=rnd(-1,1)*d*Math.tan(D.sprayR);
        px.fillStyle='rgba(220,245,255,'+rnd(.3,.8).toFixed(2)+')';
        px.beginPath(); px.arc(d,sp,rnd(2,5),0,6.283); px.fill(); }
      px.restore();
    }
    // tank bar
    px.fillStyle='#00000066'; px.fillRect(10,H-20,W*0.35,10);
    px.fillStyle=this.tank>20?'#49b6ff':'#ff5c7a'; px.fillRect(10,H-20,W*0.35*this.tank/100,10);
    px.fillStyle='#f4ead6'; px.font='700 10px '+"'Space Grotesk',system-ui"; px.textAlign='left';
    px.fillText('💧 water',10,H-24);
  }
};

/* ================= GAME 2 — Breeze: hold to fly ================= */
const Breeze={
  key:'breeze', livesLabel:'Lives',
  init(){
    lives=D.flyLives;      // flying is the twitchiest job — one extra life
    this.y=0.5; this.vy=0; this.x=0; this.obs=[]; this.kits=[]; this.inv=0;
    this.nextObs=W*0.9; this.nextKit=W*0.5; this.rot=0;
  },
  step(dt){
    this.rot+=dt*22;
    this.vy += (touch.down? -D.flyLift : 0)*dt + D.flyGrav*dt;
    this.vy=clamp(this.vy,-D.flyVmax,D.flyVmax);
    this.y += this.vy*dt/H;
    if(this.y<0.06){ this.y=0.06; this.vy=0; }
    if(this.y>0.94){ this.y=0.94; this.vy=0; }
    const dx=D.flySpd*dt; this.x+=dx;
    for(const o of this.obs) o.x-=dx;
    for(const k of this.kits) k.x-=dx;
    this.obs=this.obs.filter(o=>o.x>-W*0.3);
    this.kits=this.kits.filter(k=>k.x>-W*0.2 && !k.got);
    this.nextObs-=dx; this.nextKit-=dx;
    if(this.nextObs<=0){
      this.nextObs=W*rnd(0.75,1.05);
      const gap=D.flyGap, gy=rnd(0.20,0.80);
      this.obs.push({x:W+40, gy, gap});
      // a kitten floating in the gap: fly the clean line and you collect it
      if(rng()<0.75) this.kits.push({x:W+40, y:gy, got:false, ph:rnd(0,6.3)});
    }
    if(this.nextKit<=0){ this.nextKit=W*rnd(0.5,0.9)*D.kitten;
      this.kits.push({x:W+30, y:rnd(0.15,0.85), got:false, ph:rnd(0,6.3)}); }
    if(this.inv>0) this.inv-=dt;
    const py=this.y*H, prx=W*0.22, r=W*0.046;
    for(const o of this.obs){
      if(Math.abs(o.x-prx)<W*0.075+r*0.6){
        const top=(o.gy-o.gap/2)*H, bot=(o.gy+o.gap/2)*H;
        if((py-r<top || py+r>bot) && this.inv<=0){
          this.inv=1.1; lives--; this.vy=-120;
          bigMsg('BONK!','#ff5c7a'); pop(prx,py-30,'💥','#ff5c7a');
          if(lives<=0){ over=true; outcome='lost'; }
        }
      }
    }
    for(const k of this.kits){
      k.ph+=dt*3;
      if(!k.got && Math.hypot(k.x-prx,k.y*H-py)<r+W*0.045){
        k.got=true; score++; pop(k.x,k.y*H-20,'+1','#c6ff4a');
      }
    }
  },
  draw(){
    let g=px.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#7ec8ff'); g.addColorStop(1,'#cfeaff'); px.fillStyle=g; px.fillRect(0,0,W,H);
    // clouds
    px.fillStyle='rgba(255,255,255,.55)';
    for(let i=0;i<5;i++){ const cx=((i*W*0.42 - this.x*0.25)%(W*1.5))+W*0.1, cy=H*(0.12+i*0.16);
      px.beginPath(); px.ellipse(cx,cy,W*0.10,H*0.035,0,0,6.283); px.fill(); }
    // towers
    for(const o of this.obs){
      const top=(o.gy-o.gap/2)*H, bot=(o.gy+o.gap/2)*H, w=W*0.15;
      const tg=px.createLinearGradient(o.x-w/2,0,o.x+w/2,0);
      tg.addColorStop(0,'#4c8f4f'); tg.addColorStop(.5,'#67b46b'); tg.addColorStop(1,'#3d7440');
      px.fillStyle=tg;
      px.fillRect(o.x-w/2,0,w,top);
      px.fillRect(o.x-w/2,bot,w,H-bot);
      px.fillStyle='#2f5c33';
      px.fillRect(o.x-w/2-4,top-12,w+8,12);
      px.fillRect(o.x-w/2-4,bot,w+8,12);
    }
    // kittens
    for(const k of this.kits){
      if(k.got) continue;
      const ky=k.y*H+Math.sin(k.ph)*6;
      px.font=Math.round(W*0.075)+'px system-ui,"Apple Color Emoji"';
      px.textAlign='center'; px.textBaseline='middle';
      px.fillText('🐱',k.x,ky);
      px.strokeStyle='rgba(255,255,255,.8)'; px.lineWidth=2;
      px.beginPath(); px.moveTo(k.x,ky-W*0.04); px.lineTo(k.x,ky-W*0.075); px.stroke();
      px.fillText('🎈',k.x,ky-W*0.105);
    }
    // pup in a flying harness
    const prx=W*0.22, py=this.y*H, sz=W*0.20;
    px.save();
    if(this.inv>0 && Math.floor(this.inv*12)%2) px.globalAlpha=0.4;
    px.translate(prx,py);
    px.rotate(clamp(this.vy/900,-0.4,0.4));
    px.drawImage(ART.breeze,-sz*0.55,-sz*0.5,sz,sz);
    // rotor
    px.strokeStyle='#2b3d55'; px.lineWidth=3;
    px.beginPath(); px.moveTo(0,-sz*0.5); px.lineTo(0,-sz*0.66); px.stroke();
    px.save(); px.translate(0,-sz*0.66); px.scale(Math.cos(this.rot),1);
    px.fillStyle='#25303f'; px.beginPath(); px.roundRect(-sz*0.5,-2.5,sz,5,3); px.fill(); px.restore();
    px.restore();
  }
};

/* ================= GAME 3 — Digger: steer the tunnel ================= */
const Digger={
  key:'digger', livesLabel:'Lives',
  init(){
    this.y=0.5; this.target=0.5; this.x=0; this.items=[]; this.next=W*0.6; this.inv=0; this.trail=[];
  },
  step(dt){
    if(touch.down){ const r=play.getBoundingClientRect(); this.target=clamp(touch.y/H,0.10,0.90); }
    this.y += (this.target-this.y)*clamp(dt*7.5*D.digSteer,0,1);
    const dx=D.digSpd*dt; this.x+=dx;
    this.trail.push({x:W*0.22,y:this.y*H});
    for(const t of this.trail) t.x-=dx;
    this.trail=this.trail.filter(t=>t.x>-10);
    for(const it of this.items) it.x-=dx;
    this.items=this.items.filter(it=>it.x>-W*0.2 && !it.got);
    this.next-=dx;
    if(this.next<=0){
      this.next=W*rnd(D.digGap[0],D.digGap[1]);
      this.items.push({x:W+30, y:rnd(0.14,0.86), rock:rng()<D.rockChance, got:false, ph:rnd(0,6.3)});
    }
    if(this.inv>0) this.inv-=dt;
    const prx=W*0.22, py=this.y*H, r=W*0.046;
    for(const it of this.items){
      if(it.got) continue;
      if(Math.hypot(it.x-prx,it.y*H-py)<r+W*0.042){
        if(it.rock){
          if(this.inv>0) continue;
          it.got=true; this.inv=1.0; lives--;
          bigMsg('OUCH!','#ff5c7a'); pop(prx,py-30,'💥','#ff5c7a');
          if(lives<=0){ over=true; outcome='lost'; }
        } else { it.got=true; score++; pop(it.x,it.y*H-20,'+1','#c6ff4a'); }
      }
    }
  },
  draw(){
    // dirt
    let g=px.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#b3803f'); g.addColorStop(1,'#7a4f22'); px.fillStyle=g; px.fillRect(0,0,W,H);
    px.fillStyle='#5f3c19';
    for(let i=0;i<40;i++){ const sx=((i*97 - this.x*0.5)%(W+40))-20, sy=(i*53)%H;
      px.fillRect(sx,sy,4,4); }
    px.fillStyle='#2f6b34'; px.fillRect(0,0,W,H*0.05);
    // tunnel trail
    px.strokeStyle='#4a2f13'; px.lineWidth=W*0.10; px.lineCap='round'; px.lineJoin='round';
    px.beginPath();
    this.trail.forEach((t,i)=> i?px.lineTo(t.x,t.y):px.moveTo(t.x,t.y));
    px.stroke();
    // items
    px.textAlign='center'; px.textBaseline='middle';
    for(const it of this.items){
      if(it.got) continue;
      const iy=it.y*H+Math.sin(it.ph)*3;
      px.font=Math.round(W*0.075)+'px system-ui,"Apple Color Emoji"';
      px.fillText(it.rock?'🪨':'🦴',it.x,iy);
    }
    // pup
    const prx=W*0.22, py=this.y*H, sz=W*0.21;
    px.save();
    if(this.inv>0 && Math.floor(this.inv*12)%2) px.globalAlpha=0.4;
    px.translate(prx,py);
    px.drawImage(ART.digger,-sz*0.55,-sz*0.5,sz,sz);
    px.restore();
  }
};
const GAMES={splash:Splash, breeze:Breeze, digger:Digger};

/* ================= flow ================= */
function startGame(pupId){
  buildArt(); stopConfetti();
  cur=GAMES[pupId];
  const p=PUPS.find(x=>x.id===pupId);
  score=0; lives=D.lives; timeLeft=D.dur; over=false; started=false; outcome=null; fx=[];
  touch.down=false;
  show('game'); fit();
  cur.init();
  $('k1').textContent='Pup'; $('v1').textContent=p.name;
  $('k3').textContent=cur.livesLabel;
  $('tip').textContent=p.tip; $('tip').style.opacity='1';
  setTimeout(()=>{ $('tip').style.opacity='0'; },3600);
  countdown=2.2; bigMsg('Ready?','#ffd24a');
  lastT=performance.now();
  if(raf) cancelAnimationFrame(raf);
  raf=requestAnimationFrame(loop);
}
let raf=null,lastT=0,countdown=0,resultShown=false;
function loop(t){
  if(!at('game')){ raf=null; return; }
  const dt=Math.min(.04,(t-lastT)/1000||0); lastT=t;
  if(countdown>0){ countdown-=dt; if(countdown<=0){ started=true; bigMsg('GO!','#c6ff4a'); } }
  if(started&&!over){
    timeLeft-=dt;
    if(timeLeft<=0){ timeLeft=0; over=true; outcome='time'; }
    else cur.step(dt);
  }
  cur.draw();
  for(const f of fx){ f.a-=dt*0.8; f.y-=dt*26; }
  fx=fx.filter(f=>f.a>0.02);
  px.textAlign='center'; px.textBaseline='middle';
  px.font='700 '+Math.round(W*0.05)+'px '+"'Space Grotesk',system-ui";
  for(const f of fx){ px.globalAlpha=clamp(f.a,0,1); px.fillStyle=f.col; px.fillText(f.txt,f.x,f.y); }
  px.globalAlpha=1;
  hud();
  if(over && !resultShown){ resultShown=true; setTimeout(showResult,700); }
  raf=requestAnimationFrame(loop);
}
function hud(){
  $('vScore').textContent=score;
  $('v3').textContent = cur===Splash ? Math.max(0,Math.round(100-Splash.damage))+'%' : lives;
  $('vTime').textContent=Math.ceil(timeLeft);
}
function showResult(){
  const p=PUPS.find(x=>x.id===cur.key);
  const won = outcome!=='lost';
  const stars = !won?0 : (score>=starGoal(2)?3 : score>=starGoal(1)?2 : 1);
  const pts=score*10*D.mult + (won?40*D.mult:0);
  patrolScore+=pts;
  $('resEmoji').textContent = won ? (stars===3?'🏆':'🏅') : '😿';
  $('resTitle').textContent = won ? p.name+' did it!' : (cur===Splash?'The house burned!':p.name+' is worn out');
  $('resSub').textContent = won ? 'Great rescuing, Alexander!' : 'Have another go — you can do it!';
  $('resStars').textContent = won ? '★★★'.slice(0,stars).padEnd(3,'☆') : '';
  saveBest(cur.key,score);
  let rows='<div class="srow"><span class="k">🐾 Pup</span><span class="v">'+p.name+'</span></div>'+
    '<div class="srow"><span class="k">'+(cur===Splash?'🔥 Fires out':cur===Breeze?'🐱 Kittens':'🦴 Bones')+
      '</span><span class="v">'+score+'</span></div>'+
    '<div class="srow"><span class="k">⭐ Best</span><span class="v">'+bestOf(cur.key)+'</span></div>'+
    '<div class="srow tot"><span class="k">🏅 Points</span><span class="v">'+pts+'</span></div>';
  if(patrol) rows+='<div class="srow"><span class="k">🚨 Patrol so far</span><span class="v">'+patrolScore+'</span></div>';
  $('stats').innerHTML=rows;
  // next button only in patrol mode
  const more = patrol && patrol.length>0;
  $('nextBtn').style.display = more?'block':'none';
  if(more) $('nextBtn').textContent='Next pup: '+PUPS.find(x=>x.id===patrol[0]).name+' →';
  if(won&&stars===3) burst(2200);
  show('result');
}
function starGoal(n){
  const base = cur===Splash? [7,12] : cur===Breeze? [6,11] : [10,17];
  return base[n-1]*(diffIdx?0.75:1)|0;
}
function saveBest(k,v){ try{
  const o=JSON.parse(localStorage.getItem('alexpups')||'{}');
  const key=k+diffIdx;
  if(!o[key]||v>o[key]){ o[key]=v; localStorage.setItem('alexpups',JSON.stringify(o)); }
}catch(e){} }
function bestOf(k){ try{
  const o=JSON.parse(localStorage.getItem('alexpups')||'{}'); return o[k+diffIdx]||0;
}catch(e){ return 0; } }

/* ================= home ================= */
function renderPups(){
  const list=$('pupList'); list.innerHTML='';
  buildArt();
  for(const p of PUPS){
    const b=document.createElement('button');
    b.className='pupcard '+p.cls;
    const c=oc(120,120); c.getContext('2d').drawImage(ART[p.id],0,0,120,120);
    b.appendChild(c);
    const t=document.createElement('span'); t.className='txt';
    t.innerHTML='<span class="nm">'+p.name+'</span><span class="jb">'+p.job+'</span>';
    b.appendChild(t);
    const s=document.createElement('span'); s.className='bs'; s.textContent='★ '+bestOf(p.id);
    b.appendChild(s);
    b.onclick=()=>{ if(!at('home')) return; patrol=null; patrolScore=0; resultShown=false; startGame(p.id); };
    list.appendChild(b);
  }
}
document.querySelectorAll('.diff').forEach(b=>{ b.onclick=()=>{ if(!at('home')) return;
  diffIdx=+b.dataset.d; D=DIFFS[diffIdx];
  document.querySelectorAll('.diff').forEach(x=>x.classList.toggle('on',x===b));
  renderPups(); }; });
$('patrolBtn').onclick=()=>{ if(!at('home')) return;
  patrol=PUPS.map(p=>p.id); patrolScore=0; resultShown=false;
  const first=patrol.shift(); startGame(first); };
$('howBtn').onclick=()=>{ if(!at('home')) return;
  alert("Three rescue pups, three jobs! 🐾\n\n💧 SPLASH — touch a fire to spray water on it. Keep spraying until it goes out. Don't let the house burn!\n\n🚁 BREEZE — hold your finger down to fly up, let go to come down. Grab kittens, don't bump the trees.\n\n🦴 DIGGER — slide your finger up and down to steer the tunnel. Grab bones, dodge rocks.\n\nTry Full Patrol to play all three in a row!"); };
$('gHome').onclick=()=>{ if(!at('game')) return; over=true; resultShown=true;
  if(raf){cancelAnimationFrame(raf); raf=null;} stopConfetti(); patrol=null; show('home'); renderPups(); };
$('nextBtn').onclick=()=>{ if(!at('result')) return;
  if(patrol&&patrol.length){ resultShown=false; startGame(patrol.shift()); } };
$('againBtn').onclick=()=>{ if(!at('result')) return; resultShown=false;
  patrol=null; startGame(cur.key); };
$('resHome').onclick=()=>{ if(!at('result')) return; stopConfetti(); patrol=null; show('home'); renderPups(); };

/* ================= input ================= */
function setTouch(cx,cy,down){
  const r=play.getBoundingClientRect();
  if(r.width&&r.height){ touch.x=cx-r.left; touch.y=cy-r.top; }
  if(down!==undefined) touch.down=down;
}
play.addEventListener('pointerdown',e=>{ setTouch(e.clientX,e.clientY,true);
  try{play.setPointerCapture(e.pointerId);}catch(_){}; e.preventDefault(); });
play.addEventListener('pointermove',e=>{ if(touch.down){ setTouch(e.clientX,e.clientY); e.preventDefault(); } });
const up=()=>{ touch.down=false; };
play.addEventListener('pointerup',up); play.addEventListener('pointercancel',up);
// raw touch too: iOS holds back pointermove on vertical drags while it decides about scrolling
function tt(e){ const t=e.touches&&e.touches[0]; if(t) setTouch(t.clientX,t.clientY); }
play.addEventListener('touchstart',e=>{ tt(e); touch.down=true; e.preventDefault(); },{passive:false});
play.addEventListener('touchmove',e=>{ tt(e); e.preventDefault(); },{passive:false});
play.addEventListener('touchend',e=>{ touch.down=false; e.preventDefault(); },{passive:false});
play.addEventListener('touchcancel',()=>{ touch.down=false; },{passive:false});
window.addEventListener('keydown',e=>{ if(e.key===' '){ touch.down=true; e.preventDefault(); } });
window.addEventListener('keyup',e=>{ if(e.key===' ') touch.down=false; });
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ if(raf){ cancelAnimationFrame(raf); raf=null; } touch.down=false; }
  else if(at('game')){ lastT=performance.now(); if(!raf) raf=requestAnimationFrame(loop); }
});

buildArt(); renderPups(); fit();

/* test hook */
window.__pups={ PUPS, DIFFS, GAMES,
  setDiff:i=>{ diffIdx=i; D=DIFFS[i]; },
  start:(id,d)=>{ if(d!==undefined){ diffIdx=d; D=DIFFS[d]; } startGame(id); },
  go:()=>{ started=true; countdown=0; },
  step:dt=>{ if(started&&!over){ timeLeft-=dt; if(timeLeft<=0){ timeLeft=0; over=true; outcome='time'; } else cur.step(dt); } },
  touch:(x,y,down)=>{ touch.x=x; touch.y=y; if(down!==undefined) touch.down=down; },
  dims:()=>({W,H}),
  state:()=>({score,lives,timeLeft,over,outcome,cur,D,diffIdx,patrol,patrolScore,
              splash:Splash, breeze:Breeze, digger:Digger, touch}) };
})();
