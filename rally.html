<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1322">
<title>Alexander's Rally</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b1322; --surface:#16273f; --surface2:#1e3450; --bone:#f4ead6; --muted:#9fb2cc;
  --lime:#c6ff4a; --gold:#ffd24a; --coral:#ff5c7a; --sky:#5cc8ff;
  --display:'Space Grotesk', system-ui, sans-serif; --mono:ui-monospace,'SF Mono',Menlo,monospace;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; height:100%; overscroll-behavior:none; }
body{ font-family:var(--display); color:var(--bone); position:fixed; inset:0; overflow:hidden;
  background:radial-gradient(1200px 700px at 50% -10%, #1b2c49 0%, var(--ink) 62%) fixed, var(--ink); }
#app{ position:relative; height:100svh; height:100dvh; width:100%; max-width:980px; margin:0 auto;
  display:flex; flex-direction:column; overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
.screen{ position:absolute; inset:0; display:none; flex-direction:column;
  padding:clamp(14px,3.6vw,26px) clamp(14px,3.6vw,26px) calc(clamp(10px,2.6vw,18px) + env(safe-area-inset-bottom)); }
.screen.active{ display:flex; }
.eyebrow{ font-weight:600; letter-spacing:.22em; text-transform:uppercase; font-size:clamp(10px,2.6vw,12px); color:var(--muted); text-align:center; }
.btn{ font-family:var(--display); font-weight:700; font-size:clamp(16px,4vw,19px); color:var(--ink); background:var(--bone);
  border:none; border-radius:16px; padding:14px 18px; width:100%; cursor:pointer; box-shadow:0 6px 0 #b9ad94, 0 10px 22px #0007; }
.btn:active{ transform:translateY(4px); box-shadow:0 2px 0 #b9ad94; }
.btn.ghost{ background:var(--surface2); color:var(--bone); box-shadow:inset 0 0 0 1.5px #ffffff1c; }
.menu{ width:100%; max-width:380px; display:flex; flex-direction:column; gap:9px; margin:0 auto; }

/* ---------- home ---------- */
#home{ align-items:center; gap:clamp(8px,1.6vh,14px); overflow-y:auto; justify-content:flex-start; }
#home > :first-child{ margin-top:auto; } #home > :last-child{ margin-bottom:auto; }
.title{ line-height:.88; letter-spacing:-.03em; text-align:center; margin:0; }
.title .small{ display:block; font-size:clamp(15px,4.4vw,22px); color:var(--muted); font-weight:600; letter-spacing:0; }
.title .big{ display:block; font-size:clamp(40px,13vw,72px); font-weight:700; }
.title .big b{ color:var(--gold); }
.alex{ width:clamp(64px,16vw,84px); height:clamp(64px,16vw,84px); border-radius:50%; object-fit:cover;
  box-shadow:0 0 0 4px var(--surface2), 0 8px 22px #0009; }
.cap{ color:var(--muted); font-weight:600; font-size:clamp(12px,3.2vw,14px); text-align:center; max-width:380px; }
.diffrow{ display:flex; gap:7px; width:100%; max-width:380px; }
.diff{ flex:1; font-family:var(--display); font-weight:700; color:var(--ink); border:none; border-radius:13px; padding:10px 4px;
  cursor:pointer; box-shadow:0 4px 0 #8e8a80; font-size:clamp(12px,3.4vw,14px); background:#c9d3df; opacity:.55; line-height:1.15; }
.diff small{ display:block; font-weight:600; font-size:.78em; opacity:.8; }
.diff.on{ opacity:1; background:var(--gold); box-shadow:0 4px 0 #b9922b; }
.stages{ display:grid; grid-template-columns:1fr 1fr; gap:9px; width:100%; max-width:380px; }
.scard{ position:relative; border:none; border-radius:16px; padding:0; cursor:pointer; overflow:hidden; text-align:left;
  color:#fff; box-shadow:0 6px 0 #0006, inset 0 0 0 1.5px #ffffff22; aspect-ratio:1.15; font-family:var(--display); }
.scard:active{ transform:translateY(3px); box-shadow:0 3px 0 #0006; }
.scard canvas{ position:absolute; inset:0; width:100%; height:100%; }
.scard .lab{ position:absolute; left:0; right:0; bottom:0; padding:22px 10px 8px; background:linear-gradient(transparent,#000c); }
.scard .ss{ font-family:var(--mono); font-weight:700; font-size:11px; color:var(--gold); }
.scard .nm{ display:block; font-weight:700; font-size:clamp(14px,3.9vw,17px); line-height:1.1; }
.scard .meta{ display:flex; justify-content:space-between; font-weight:600; font-size:11px; opacity:.9; margin-top:2px; }

/* ---------- game ---------- */
#game{ padding:calc(env(safe-area-inset-top) + 6px) 8px calc(env(safe-area-inset-bottom) + 8px); gap:7px; }
.stage{ position:relative; flex:1; min-height:0; border-radius:16px; overflow:hidden; box-shadow:0 12px 30px #000a; background:#000; }
canvas#view{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
.hud{ position:absolute; pointer-events:none; text-shadow:0 2px 6px #000b; }
.tl{ left:8px; top:8px; background:#0a1220a6; padding:4px 10px 6px; border-radius:12px; }
.spd{ font-family:var(--mono); font-weight:700; font-size:clamp(30px,8.5vw,46px); line-height:1; }
.unit{ font-weight:700; font-size:11px; letter-spacing:.08em; color:#d9e3ef; }
.unit b{ color:var(--gold); }
.tr{ right:8px; top:8px; text-align:right; background:#0a1220a6; padding:4px 10px 6px; border-radius:12px; }
.time{ font-family:var(--mono); font-weight:700; font-size:clamp(18px,5vw,26px); line-height:1.1; }
.delta{ font-family:var(--mono); font-weight:700; font-size:clamp(13px,3.6vw,16px); }
.delta.up{ color:#ff8a8a; } .delta.dn{ color:#9dff7a; }
.rivname{ font-weight:600; font-size:10px; letter-spacing:.06em; color:#d9e3ef; }
.note{ position:absolute; left:50%; top:52px; transform:translateX(-50%); display:flex; align-items:center; gap:8px;
  background:#0a1220d9; border-radius:16px; padding:6px 14px 6px 6px; box-shadow:0 6px 18px #0008, inset 0 0 0 1.5px #ffffff22;
  pointer-events:none; transition:opacity .18s; opacity:0; }
.note.show{ opacity:1; }
.note canvas{ width:clamp(46px,12vw,62px); height:clamp(46px,12vw,62px); }
.note.noglyph canvas{ display:none; }
.nmain{ font-weight:700; font-size:clamp(20px,5.6vw,30px); letter-spacing:.02em; line-height:1; white-space:nowrap; }
.nmod{ font-weight:700; font-size:clamp(11px,3vw,13px); color:var(--gold); letter-spacing:.06em; text-transform:uppercase; white-space:nowrap; }
.nmod.warnc{ color:#ff7a7a; }
.next{ position:absolute; left:50%; top:calc(52px + clamp(60px,15vw,76px)); transform:translateX(-50%); font-weight:700;
  font-size:12px; color:#d9e3ef; background:#0a1220a8; padding:3px 10px; border-radius:9px; pointer-events:none; white-space:nowrap; opacity:0; }
.next.show{ opacity:1; }
.warn{ position:absolute; left:50%; top:46%; transform:translate(-50%,-50%); font-weight:700; font-size:clamp(26px,8vw,44px);
  color:#fff; background:#d8283fe6; padding:4px 18px; border-radius:12px; pointer-events:none; opacity:0; letter-spacing:.06em; }
.warn.show{ animation:pulse .45s ease-in-out infinite alternate; }
@keyframes pulse{ from{opacity:.55; transform:translate(-50%,-50%) scale(.96);} to{opacity:1; transform:translate(-50%,-50%) scale(1.04);} }
.bigmsg{ position:absolute; left:50%; top:38%; transform:translate(-50%,-50%); font-weight:700; font-size:clamp(30px,10vw,58px);
  pointer-events:none; opacity:0; text-shadow:0 4px 18px #000c; white-space:nowrap; }
.bigmsg.show{ animation:bm 1s ease-out; }
@keyframes bm{ 0%{opacity:0;transform:translate(-50%,-50%) scale(.6);} 20%{opacity:1;transform:translate(-50%,-50%) scale(1.1);} 70%{opacity:1;} 100%{opacity:0;transform:translate(-50%,-50%) scale(1);} }
.lights{ position:absolute; left:50%; top:40%; transform:translate(-50%,-50%); display:flex; gap:10px; background:#111c; padding:10px 14px;
  border-radius:16px; pointer-events:none; opacity:0; }
.lights.show{ opacity:1; }
.lights i{ width:clamp(26px,7vw,38px); height:clamp(26px,7vw,38px); border-radius:50%; background:#3a0d12; box-shadow:inset 0 2px 5px #000; }
.lights i.r{ background:radial-gradient(circle at 40% 35%,#ff9a9a,#ff2a3d 55%,#a30d1c); box-shadow:0 0 18px #ff2a3d; }
.lights i.g{ background:radial-gradient(circle at 40% 35%,#d6ffb0,#4dff4d 55%,#139c13); box-shadow:0 0 18px #4dff4d; }
.bl{ left:10px; bottom:22px; width:min(34%,170px); }
.dmglab{ font-weight:700; font-size:10px; letter-spacing:.08em; color:#d9e3ef; margin-bottom:3px; }
.dmgbar{ height:7px; border-radius:5px; background:#0009; overflow:hidden; box-shadow:inset 0 0 0 1px #ffffff22; }
.dmgbar i{ display:block; height:100%; width:0%; background:linear-gradient(90deg,#ffd24a,#ff5c3a); }
.prog{ position:absolute; left:10px; right:10px; bottom:8px; height:6px; border-radius:4px; background:#0008; pointer-events:none;
  box-shadow:inset 0 0 0 1px #ffffff1c; }
.prog .fill{ position:absolute; left:0; top:0; bottom:0; width:0; background:linear-gradient(90deg,#3a7bd5,#5cc8ff); border-radius:4px; }
.prog .dot{ position:absolute; top:50%; width:12px; height:12px; margin:-6px 0 0 -6px; border-radius:50%; }
.prog .me{ background:var(--gold); box-shadow:0 0 6px var(--gold); }
.prog .riv{ background:#ff7a29; box-shadow:0 0 6px #ff7a29; }
.prog .tick{ position:absolute; top:-3px; width:2px; height:12px; background:#ffffff88; }
.topbtns{ position:absolute; left:50%; top:8px; transform:translateX(-50%); display:flex; gap:6px; }
.ibtn{ font-size:15px; color:var(--bone); background:#0a1220b8; border:none; border-radius:10px; width:34px; height:34px; cursor:pointer;
  box-shadow:inset 0 0 0 1.5px #ffffff20; display:flex; align-items:center; justify-content:center; }
.ibtn.off{ opacity:.45; }
.controls{ display:flex; gap:8px; height:clamp(92px,24vw,128px); flex:none; }
.wheelpad{ position:relative; flex:1.5; border-radius:18px; background:linear-gradient(180deg,#1b2b45,#111c30);
  box-shadow:inset 0 0 0 1.5px #ffffff18, 0 5px 0 #070d18; touch-action:none; overflow:hidden; cursor:pointer; }
.wheelpad .rail{ position:absolute; left:10%; right:10%; top:50%; height:4px; margin-top:-2px; border-radius:3px; background:#ffffff14; }
.wheelpad .hint{ position:absolute; left:0; right:0; bottom:6px; text-align:center; font-weight:700; font-size:10px; letter-spacing:.12em;
  color:#9fb2cc; pointer-events:none; }
.wheel{ position:absolute; left:50%; top:50%; width:clamp(70px,19vw,100px); height:clamp(70px,19vw,100px); margin:0;
  transform:translate(-50%,-56%) rotate(0deg); pointer-events:none; }
.pedals{ flex:1; display:flex; gap:8px; }
.pedal{ flex:1; border:none; border-radius:16px; font-family:var(--display); font-weight:700; font-size:clamp(13px,3.6vw,17px);
  letter-spacing:.06em; cursor:pointer; touch-action:none; color:#fff; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:3px; }
.pedal .pi{ width:62%; height:38%; border-radius:6px; background:repeating-linear-gradient(0deg,#0004 0 4px,#fff2 4px 8px); }
.brake{ background:linear-gradient(180deg,#e04358,#9b1a2c); box-shadow:0 6px 0 #5e0f1a, inset 0 0 0 1.5px #ffffff30; }
.gas{ background:linear-gradient(180deg,#3fbf5c,#1b7a33); box-shadow:0 6px 0 #0f4a1d, inset 0 0 0 1.5px #ffffff30; }
.pedal.on{ transform:translateY(5px); filter:brightness(1.25); box-shadow:0 1px 0 #000, inset 0 0 0 1.5px #ffffff40; }
.gas.auto{ background:linear-gradient(180deg,#2c6e3d,#1a4a27); opacity:.75; }

/* ---------- result ---------- */
#result{ justify-content:center; gap:9px; text-align:center; overflow-y:auto; align-items:center; }
.res-emoji{ font-size:clamp(40px,12vw,60px); line-height:1; }
.res-title{ font-weight:700; font-size:clamp(22px,6.4vw,32px); }
.res-sub{ color:var(--muted); font-weight:600; font-size:clamp(12px,3.3vw,14px); margin-top:-3px; max-width:380px; }
.stars{ font-size:clamp(26px,8vw,38px); letter-spacing:4px; height:1.2em; color:var(--gold); }
.stats{ width:100%; max-width:340px; background:var(--surface); border-radius:15px; padding:9px 12px; box-shadow:inset 0 0 0 1.5px #ffffff10; }
.srow{ display:flex; justify-content:space-between; padding:3px 0; font-weight:600; font-size:clamp(12px,3.3vw,14px); }
.srow .k{ color:var(--muted); } .srow .v{ font-family:var(--mono); font-weight:700; }
.srow.tot{ border-top:1.5px solid #ffffff1a; margin-top:4px; padding-top:7px; font-size:clamp(14px,4vw,17px); }
.srow.tot .v{ color:var(--lime); }
#confetti{ position:absolute; inset:0; z-index:60; pointer-events:none; display:none; }
</style>
</head>

<script>
(function(){

/* ================= confetti ================= */
const cv=$('confetti'), cctx=cv.getContext('2d'); let parts=[], confRaf=null, confUntil=0;

function burst(ms){
  sizeCv(); cv.style.display='block';

  for(let i=0;i<110;i++) parts.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.4,vx:(Math.random()-.5)*1.6,

function confLoop(){

  parts=parts.filter(p=>p.y<cv.height+40);
  if(performance.now()<confUntil||parts.length) confRaf=requestAnimationFrame(confLoop);
  else { confRaf=null; cctx.clearRect(0,0,cv.width,cv.height); cv.style.display='none'; }
}
function stopConfetti(){ parts=[]; if(confRaf){ cancelAnimationFrame(confRaf); confRaf=null; } cctx.clearRect(0,0,cv.width,cv.height); cv.style.display='none'; }

/* ==================================================================

function tierPine(g,w,h,seed,snow,tone){
  const r=mulberry(seed);
  g.fillStyle='#3d2a1c'; g.fillRect(w/2-5,h-44,10,44);
  g.fillStyle='#2a1d13'; g.fillRect(w/2+1,h-44,4,44);
  const tiers=7, top=10, base=h-30;
  for(let i=0;i<tiers;i++){
    const t=i/(tiers-1);
    const yb=base-(base-top)*t*0.86;
    const th=(base-top)*0.30*(1-t*0.35);
    const tw=w*0.48*(1-t*0.80)*(0.92+r()*0.16);
    const grd=g.createLinearGradient(w/2-tw,0,w/2+tw,0);
    grd.addColorStop(0,tone[0]); grd.addColorStop(.42,tone[1]); grd.addColorStop(1,tone[2]);
    g.fillStyle=grd;
    g.beginPath(); g.moveTo(w/2,yb-th);
    const n=7;
    for(let k=1;k<=n;k++){ const f=k/n; g.lineTo(w/2+tw*f+(k%2?3:-3), yb-th+th*f+(k%2?-5:2)); }
    g.quadraticCurveTo(w/2,yb+7,w/2-tw,yb);
    for(let k=n;k>=1;k--){ const f=k/n; g.lineTo(w/2-tw*f-(k%2?3:-3), yb-th+th*f+(k%2?-5:2)); }
    g.closePath(); g.fill();
    // needle texture
    g.strokeStyle='rgba(0,0,0,.18)'; g.lineWidth=1;
    for(let k=0;k<10;k++){ const x=w/2+(r()-.5)*tw*1.6, y=yb-th*r()*0.8; g.beginPath(); g.moveTo(x,y); g.lineTo(x+(r()-.5)*8,y+6); g.stroke(); }
    g.fillStyle='rgba(255,255,255,.07)';
    g.beginPath(); g.moveTo(w/2,yb-th); g.lineTo(w/2-tw*.7,yb-th*.1); g.lineTo(w/2-tw*.2,yb-th*.25); g.closePath(); g.fill();
    if(snow){
      g.fillStyle='rgba(250,252,255,.95)';
      g.beginPath(); g.moveTo(w/2,yb-th-1);
      g.lineTo(w/2+tw*.62,yb-th*.38); g.lineTo(w/2+tw*.35,yb-th*.42); g.lineTo(w/2+tw*.15,yb-th*.3);
      g.lineTo(w/2-tw*.1,yb-th*.44); g.lineTo(w/2-tw*.4,yb-th*.34); g.lineTo(w/2-tw*.66,yb-th*.4);
      g.closePath(); g.fill();
      g.fillStyle='rgba(170,195,225,.5)';
      g.beginPath(); g.ellipse(w/2+tw*.3,yb-th*.38,tw*.22,3,0,0,6.283); g.fill();
    }
  }
}
function makePine(seed,snow){
  const w=150,h=330,c=oc(w,h),g=c.getContext('2d');

  return c;
}
function makeBirch(seed){
  const w=170,h=320,c=oc(w,h),g=c.getContext('2d'); const r=mulberry(seed);
  const tg=g.createLinearGradient(w/2-9,0,w/2+9,0); tg.addColorStop(0,'#fbf7ee'); tg.addColorStop(.6,'#ded6c6'); tg.addColorStop(1,'#a59c8b');
  g.fillStyle=tg; g.beginPath(); g.moveTo(w/2-9,h); g.lineTo(w/2-5,h*0.25); g.lineTo(w/2+5,h*0.25); g.lineTo(w/2+9,h); g.closePath(); g.fill();
  g.fillStyle='#2b2620';
  for(let i=0;i<14;i++){ const y=h*0.3+r()*h*0.66; g.fillRect(w/2-8+r()*6,y,6+r()*7,2+r()*2); }
  const blobs=[[0,.24,.4],[-.22,.32,.3],[.22,.3,.3],[-.1,.14,.28],[.12,.12,.27],[0,.05,.2],[-.26,.2,.22],[.26,.2,.2]];
  for(const [bx,by,br] of blobs){
    const x=w/2+bx*w, y=h*by+20, rad=br*w*0.62;
    const gg=g.createRadialGradient(x-rad*.35,y-rad*.4,rad*.1,x,y,rad);
    gg.addColorStop(0,'#c9df6a'); gg.addColorStop(.55,'#86ad3a'); gg.addColorStop(1,'#4d7424');

  for(let i=0;i<40;i++){ g.beginPath(); g.arc(w/2+(r()-.5)*w*.7, 30+r()*h*.35, 2+r()*3,0,6.283); g.fill(); }

}
function lump(g,n,R,jit,seed,sx,sy){
  const r=mulberry(seed); g.beginPath();
  for(let i=0;i<n;i++){ const a=Math.PI+i/(n-1)*Math.PI, rad=R*(1-jit+r()*jit*2);

function makeRock(seed,cols,moss,snowcap){
  const w=180,h=120,c=oc(w,h),g=c.getContext('2d');

  g.fillStyle=grd; g.fill(); g.save(); g.clip();

  for(let i=0;i<6;i++){ g.fillStyle='rgba(0,0,0,'+(.08+r()*.12).toFixed(2)+')';
    g.beginPath(); g.moveTo((r()-.5)*150,-r()*100); g.lineTo((r()-.5)*150,-r()*100); g.lineTo((r()-.5)*150,0); g.closePath(); g.fill(); }

}
function makeBush(seed,cols){

  for(let i=0;i<9;i++){ const x=30+r()*90, y=40+r()*30, rad=18+r()*16;

function makeCactus(seed){
  const w=120,h=260,c=oc(w,h),g=c.getContext('2d'); const r=mulberry(seed);

function makeSnowbank(seed){
  const w=220,h=80,c=oc(w,h),g=c.getContext('2d');

function makeSpectators(seed){
  const w=220,h=150,c=oc(w,h),g=c.getContext('2d'); const r=mulberry(seed);

function makeChevron(dir){

function makeRange(w,h,o){
  const c=oc(w,h),g=c.getContext('2d');
  const yAt=x=>{ let y=0; for(const [a,f,p] of o.waves) y+=a*Math.sin(x/w*Math.PI*2*f+p); return h*o.base-y; };
  g.beginPath(); g.moveTo(0,h);
  if(o.mesa){
    for(let x=0;x<=w;x+=2){ const raw=yAt(x); const q=Math.round(raw/o.mesa)*o.mesa; g.lineTo(x, q); }
  } else for(let x=0;x<=w;x+=3) g.lineTo(x,yAt(x));
  g.lineTo(w,h); g.closePath();
  const gg=g.createLinearGradient(0,h*0.15,0,h); gg.addColorStop(0,o.c1); gg.addColorStop(1,o.c2);
  g.fillStyle=gg; g.fill();
  if(o.snow){ g.save(); g.clip(); g.fillStyle=o.snow;
    g.beginPath(); g.moveTo(0,0); for(let x=0;x<=w;x+=3){ g.lineTo(x, h*o.snowLine + 9*Math.sin(x*0.07)+6*Math.sin(x*0.19)); } g.lineTo(w,0); g.closePath(); g.fill();
    g.restore(); }
  if(o.shade){ g.save(); g.clip(); g.fillStyle=o.shade;
    for(let x=0;x<w;x+=37){ g.beginPath(); g.moveTo(x,yAt(x)); g.lineTo(x+18,h); g.lineTo(x+30,h); g.closePath(); g.fill(); } g.restore(); }
  return c;
}
function makeTreeline(w,h,c1,c2,snow,seed){
  const c=oc(w,h),g=c.getContext('2d'); const r=mulberry(seed);
  const gg=g.createLinearGradient(0,0,0,h); gg.addColorStop(0,c1); gg.addColorStop(1,c2);
  g.fillStyle=gg; g.fillRect(0,h*0.62,w,h*0.38);

function makeSky(st){

  const gg=g.createLinearGradient(0,0,0,h); gg.addColorStop(0,st.skyTop); gg.addColorStop(.7,st.skyMid||st.skyBot); gg.addColorStop(1,st.skyBot);

const STEER=1.6, KC=STEER/2.3, CAR_HALF=0.17, CAR_IMG_WW=0.39, SLIDE=5;
const SEV_CURVE={6:1.1,5:2.35,4:3,3:4.2,2:5.4,1:7};

const easeIn=(a,b,p)=>a+(b-a)*p*p;
const easeInOut=(a,b,p)=>a+(b-a)*(-Math.cos(p*Math.PI)/2+0.5);
function lastY(){ return segs.length?segs[segs.length-1].p2.w.y:0; }
function addSeg(curve,y){
  const n=segs.length;
  segs.push({i:n, p1:{w:{y:lastY(),z:n*SEG_LEN},c:{},s:{}}, p2:{w:{y,z:(n+1)*SEG_LEN},c:{},s:{}},
    curve, spr:[], band:Math.floor(n/3)%2, clip:0, fog:0, gate:null});
}
function addRoad(en,hold,lv,curve,h){
  const sy=lastY(), ey=sy+h*SEG_LEN, tot=Math.max(1,en+hold+lv);
  for(let i=0;i<en;i++) addSeg(easeIn(0,curve,i/en), easeInOut(sy,ey,i/tot));
  for(let i=0;i<hold;i++) addSeg(curve, easeInOut(sy,ey,(en+i)/tot));
  for(let i=0;i<lv;i++) addSeg(easeInOut(curve,0,i/lv), easeInOut(sy,ey,(en+hold+i)/tot));
}
function pickSev(w){ let t=0; for(let i=1;i<=6;i++) t+=w[i]; let x=srand()*t; for(let i=1;i<=6;i++){ x-=w[i]; if(x<=0) return i; } return 6; }

}
function buildStage(st,d){
  ST=st; D=d; segs=[]; notes=[]; srand=mulberry(st.seed);
  addRoad(0,46,0,0,0);
  let straightRun=46, lastStraight=true, guard=0;
  while(segs.length<st.len && guard++<2000){
    const r=srand();
    if(r<st.crestP){
      const h=sri(st.crestH[0],st.crestH[1]);
      const up=sri(16,24), dn=sri(16,24);
      const startC=segs.length;
      addRoad(Math.ceil(up/2),0,Math.floor(up/2),0,h);
      const top=segs.length;
      addRoad(Math.ceil(dn/2),0,Math.floor(dn/2),0,-h*sr(.75,1.15));
      notes.push({type:'crest', seg:startC, at:top, end:segs.length, jump:h>=9, dir:0, sev:0});
      straightRun+=segs.length-startC; lastStraight=true;
    } else if(r<st.crestP+st.straightP && !lastStraight){
      const len=sri(st.straight[0],st.straight[1]);
      const h=srand()<st.hillP? sri(-9,9):0;
      addRoad(6,len,6,0,h); straightRun+=len+12; lastStraight=true;
    } else {
      const sev=pickSev(st.sevW), dir=srand()<.5?-1:1;
      const hold= sev>=5? sri(30,58) : sev>=3? sri(24,42) : sri(16,26);
      const en=sri(12,18), lv=sri(12,18);
      const h=srand()<st.hillP? sri(-7,7):0;
      const start=segs.length;
      addRoad(en,hold,lv,dir*SEV_CURVE[sev],h);
      notes.push({type:'corner', seg:start, end:segs.length, dir, sev, long:hold>=48,
        caution: sev<=2 && straightRun>34, dontCut: sev<=3 && srand()<.4});
      straightRun=0; lastStraight=false;

  }

  finishSeg=segs.length-14;
  addRoad(0,260,0,0,0);
  segs[8].gate='start'; segs[finishSeg].gate='finish';
  splitSegs=[Math.round(finishSeg/3), Math.round(finishSeg*2/3)];
  // chaining: a corner that starts right after the previous one ends is called with "into"
  for(let i=0;i<notes.length-1;i++){
    if(notes[i+1].seg - notes[i].end <= 22) notes[i].into=true;

function placeScenery(st){
  const cl=D.clearance;
  const pickF=()=>{ const r=srand(); return r<.58?'pine': r<.80?'birch': r<.9?'rock':'bush'; };
  for(let i=0;i<segs.length;i++){
    const s=segs[i];
    if(i<26 || (i>finishSeg-22 && i<finishSeg+40)){
      if(i%4===0) for(const side of [-1,1]) addSpr(s,'spect',side*(2.9+srand()*.5));
      continue;
    }
    for(const side of [-1,1]){
      if(st.scen==='forest'){
        if(srand()<.6) addSpr(s,pickF(),side*(1.38+cl+srand()*1.4));
        if(srand()<.55) addSpr(s,srand()<.7?'pine':'birch',side*(3.0+srand()*3.6));
        if(srand()<.05) addSpr(s,'bush',side*(1.2+srand()*.12));
      } else if(st.scen==='desert'){
        const r=srand();
        if(r<.10) addSpr(s,'cactus',side*(1.45+cl+srand()*2.2));
        else if(r<.16) addSpr(s,'redrock',side*(1.5+cl+srand()*2.4));
        else if(r<.30) addSpr(s,'drybush',side*(1.25+srand()*3));
        if(srand()<.12) addSpr(s,srand()<.5?'redrock':'cactus',side*(4+srand()*5));
      } else {
        if(srand()<.42) addSpr(s,'snowbank',side*(1.24+cl*.6+srand()*.08));
        if(srand()<.5) addSpr(s,srand()<.88?'snowpine':'snowrock',side*(1.6+cl+srand()*1.6));
        if(srand()<.5) addSpr(s,'snowpine',side*(3.3+srand()*3.6));
      }
    }
  }
  for(const n of notes){
    if(n.type==='corner' && n.sev<=3){
      const outside=-n.dir;
      for(let k=n.seg+4;k<n.end-4;k+=5) if(segs[k]) addSpr(segs[k], n.dir<0?'chevL':'chevR', outside*(1.2+cl*.3));
      if(n.dontCut){ const k=Math.round((n.seg+n.end)/2);
        if(segs[k]) addSpr(segs[k], st.scen==='desert'?'redrock':st.scen==='snow'?'snowrock':'rock', n.dir*(1.22+cl*.5)); }
      if(n.sev===1) for(let k=n.seg;k<n.end;k+=3) if(segs[k]) addSpr(segs[k],'spect',outside*(3.0+srand()*.4));
    }
    if(n.type==='crest' && n.jump) for(let k=n.at-3;k<n.at+3;k+=2) if(segs[k]) addSpr(segs[k],'spect',(srand()<.5?-1:1)*(3.0+srand()*.5));
  }
}
/* cornering limit: steering authority must cover the outward push */
function safeSp(curve,grip){
  const a=Math.abs(curve)*KC*D.centr/grip;
  if(a<1e-6) return 1;
  const S=STEER, sp=(0.65*S+Math.sqrt(0.4225*S*S+4*a*0.35*S))/(2*a);
  return Math.min(1,sp);
}
function computeRival(){
  const n=finishSeg+2, v=new Float64Array(n);
  for(let i=0;i<n;i++) v[i]=safeSp(segs[i].curve,ST.grip)*0.96*MAXS;
  const dec=BRAKE*(0.55+0.45*ST.grip);
  for(let i=n-2;i>=0;i--) v[i]=Math.min(v[i], Math.sqrt(v[i+1]*v[i+1]+2*dec*SEG_LEN));
  const s0=Math.floor(PLAYER_Z/SEG_LEN);
  let u=0; const fv=new Float64Array(n);
  for(let i=s0;i<n;i++){ const acc=ACCEL*(1-0.55*u/MAXS); const nu=Math.sqrt(u*u+2*acc*SEG_LEN); u=Math.min(nu,v[i]); fv[i]=u; }
  rivalT=new Float64Array(n+1);
  let t=0, prev=0;
  for(let i=0;i<=n;i++){
    rivalT[i]=t;
    if(i<s0 || i>=n) continue;
    const uu=Math.max(200,(prev+fv[i])/2*D.rival*(ST.rivalAdj||1)); t+=SEG_LEN/uu; prev=fv[i];
  }
}
function rivalTimeAt(z){ const sf=z/SEG_LEN, i=Math.floor(sf); if(i>=rivalT.length-1) return rivalT[rivalT.length-1];
  if(i<0) return 0; return lerp(rivalT[i],rivalT[i+1],sf-i); }
function rivalZAt(t){
  let lo=0, hi=rivalT.length-1;
  if(t>=rivalT[hi]) return hi*SEG_LEN;
  while(hi-lo>1){ const m=(lo+hi)>>1; if(rivalT[m]<=t) lo=m; else hi=m; }
  const span=rivalT[hi]-rivalT[lo]||1;
  return (lo+(t-rivalT[lo])/span)*SEG_LEN;
}
const findSeg=z=>segs[clamp(Math.floor(z/SEG_LEN),0,segs.length-1)];

/* ================= run state ================= */
let pos=0, speed=0, px=0, latV=0, raceT=0, state='idle', damage=0, invT=0, airT=0, airMax=0, airBad=false;
let steerTarget=0, steerVal=0, gasHeld=false, brakeHeld=false, bgOff=0, shake=0, gear=1, flameT=0;
let nextNote=0, curNote=null, curNoteT=0, upcoming=null, splitIdx=0, crashes=0, jumps=0, landedClean=0, finishT=0;
let dust=[], flakes=[], sliding=0, prevSegI=0, resultShown=false, countT=0, lightsN=0;
let stats={top:0};
function resetRun(){
  pos=0; speed=0; px=0; latV=0; raceT=0; damage=0; invT=0; airT=0; airMax=0; airBad=false;
  steerTarget=0; steerVal=0; gasHeld=false; brakeHeld=false; bgOff=0; shake=0; gear=1; flameT=0;
  nextNote=0; curNote=null; curNoteT=0; upcoming=null; splitIdx=0; crashes=0; jumps=0; landedClean=0; finishT=0;
  dust=[]; sliding=0; prevSegI=Math.floor(PLAYER_Z/SEG_LEN); resultShown=false; stats={top:0};
  flakes=[]; for(let i=0;i<110;i++) flakes.push({x:Math.random(),y:Math.random(),z:Math.random()});
}

/* ================= physics ================= */
function step(dt){
  if(state!=='run' && state!=='done') return;
  const carZ=pos+PLAYER_Z, seg=findSeg(carZ);
  const sp=speed/MAXS;
  const offroad=Math.abs(px)>1;
  const grip=ST.grip*(offroad?.55:1);
  // ---- pedals ----
  let gas=0, brk=0;
  if(state==='done'){ brk=1; }
  else { brk=brakeHeld?1:0; gas = D.autoGas ? (brk?0:1) : (gasHeld?1:0); }
  if(airT<=0){
    if(brk) speed-=BRAKE*(0.55+0.45*grip)*dt;
    else if(gas) speed+=ACCEL*(1-0.55*sp)*dt*(offroad?.55:1);
    else speed-=COAST*dt;
  }
  const topSp=MAXS*(1-damage*0.0025);
  if(offroad && speed>MAXS*.42) speed-=MAXS*0.85*dt;
  speed=clamp(speed,0,topSp);
  // ---- steering ----
  steerVal+=(steerTarget-steerVal)*clamp(dt*12,0,1);
  if(airT<=0){
    // tyres can hold a sideways load up to holdCap; past that they break away and the car slides wide fast
    const holdCap=STEER*Math.min(1,sp*5)*(0.35+0.65*sp);
    const push=seg.curve*sp*sp*KC*D.centr/grip;
    let target;
    if(Math.abs(push)>holdCap){
      const out=Math.sign(push), aligned=clamp(steerVal*out,0,1);
      sliding=Math.min(1,sliding+dt*4);
      target=-out*((Math.abs(push)-holdCap)*SLIDE + holdCap*(1-aligned)) + (steerVal-aligned*out)*holdCap*0.3;
    } else {
      sliding=Math.max(0,sliding-dt*3);
      target=steerVal*holdCap - push;
    }
    if(D.assist && Math.abs(steerVal)<0.12) target+=-px*D.assist*Math.min(1,sp*3);
    latV+=(target-latV)*clamp(dt*(2.2+5.5*grip),0,1);
  }
  px=clamp(px+latV*dt,-2.35,2.35);
  if(Math.abs(px)>=2.35) latV*=-0.2;
  // ---- move ----
  const ds=speed*dt; pos+=ds;
  if(state==='run') raceT+=dt;
  bgOff+=seg.curve*(ds/SEG_LEN)*3.2;
  const sp2=speed/MAXS;
  if(sp2>stats.top) stats.top=sp2;
  // gears (for the HUD and the engine note)
  const g=Math.min(6,1+Math.floor(sp2*6.2));
  if(g>gear){ flameT=0.09; } gear=g;
  if(flameT>0) flameT-=dt;
  if(invT>0) invT-=dt;
  if(shake>0) shake=Math.max(0,shake-dt*2.5);
  // ---- crests and jumps ----
  const segI=Math.floor((pos+PLAYER_Z)/SEG_LEN);
  if(airT>0){ airT-=dt; if(airT<=0) land(); }
  for(const n of notes){
    if(n.type!=='crest') continue;
    if(n.at>prevSegI && n.at<=segI){
      const need=n.jump?0.58:0.86;
      if(sp2>need && airT<=0){
        airMax=airT=n.jump? 0.22+(sp2-need)*1.25 : 0.12;
        airBad = n.jump && Math.abs(steerVal)>0.45;
        if(n.jump) jumps++;
      }
    }
  }
  // ---- collisions ----
  if(airT<=0 && invT<=0){
    for(const sgi of [segI,segI+1]){
      const s=segs[sgi]; if(!s) continue;
      for(const o of s.spr){
        if(!o.hw) continue;
        if(Math.abs(px-o.off)<CAR_HALF+o.hw){ crash(o); break; }
      }
      if(invT>0) break;
    }
  }
  // ---- pace notes ----
  if(state==='run') paceNotes(segI);
  // ---- splits / finish ----
  if(state==='run'){
    if(splitIdx<splitSegs.length && segI>=splitSegs[splitIdx]){
      const dlt=raceT-rivalTimeAt(splitSegs[splitIdx]*SEG_LEN);
      bigMsg('Split '+(splitIdx+1)+'  '+fmtDelta(dlt), dlt<=0?'#9dff7a':'#ff8a8a'); splitIdx++;
    }
    if(segI>=finishSeg){ state='done'; finishT=raceT; say('Finish! Brilliant driving.'); bigMsg('FINISH!','#ffd24a'); }
    if(damage>=100){ state='retired'; speed=0; say('Oh no. We have to retire.'); bigMsg('RETIRED','#ff5c7a'); }
  }
  prevSegI=segI;
}
function crash(o){
  const away = o.off>px ? -1 : 1;
  if(o.soft){
    speed*=0.62; damage=Math.min(100,damage+Math.max(1,D.dmg*0.15));
    px=o.off+away*(CAR_HALF+o.hw+0.02); latV=away*0.5; invT=0.45; shake=0.5;
    bigMsg('Snowbank!','#bfe9ff');
  } else {
    speed*=0.18; damage=Math.min(100,damage+D.dmg); crashes++;
    px=o.off+away*(CAR_HALF+o.hw+0.03); latV=away*0.7; invT=1.0; shake=1;
    bigMsg('CRASH!','#ff5c7a');
    if(crashes===1 || Math.random()<.4) say(['Careful!','Ouch! Keep going.','Back on the road!'][Math.floor(Math.random()*3)]);
  }
}
function land(){
  shake=Math.max(shake,0.6);
  if(airBad && D.badLand){ speed*=0.55; damage=Math.min(100,damage+D.dmg*0.6); latV+=Math.sign(steerVal||1)*0.9; bigMsg('Bad landing!','#ff8a8a'); }
  else if(airMax>0.3){ landedClean++; bigMsg('Big air!','#c6ff4a'); }
  airBad=false;
}

/* ================= co-driver ================= */
const NUMW={1:'one',2:'two',3:'three',4:'four',5:'five',6:'six'};
function noteText(n){
  if(n.type==='crest') return {main:n.jump?'JUMP':'CREST', mod:n.jump?'keep it straight':'over crest', speak:n.jump?'jump! keep it straight':'over crest', warn:n.jump};
  const d=n.dir<0?'left':'right', D2=n.dir<0?'L':'R';
  let main= n.sev===1 ? 'HAIRPIN '+D2 : (n.dir<0?'LEFT ':'RIGHT ')+n.sev;
  let speak= n.sev===1 ? 'hairpin '+d : d+' '+NUMW[n.sev];
  const mods=[];
  if(n.long){ mods.push('long'); speak='long '+speak; }
  if(n.dontCut){ mods.push("don't cut"); speak+=", don't cut"; }
  if(n.caution){ mods.unshift('caution!'); speak='caution! '+speak; }
  return {main, mod:mods.join(' · '), speak, warn:n.caution||n.sev<=2};
}
function paceNotes(segI){
  const segsPerSec=Math.max(speed,MAXS*0.35)/SEG_LEN;
  const ahead=Math.max(44,segsPerSec*2.5);
  if(nextNote<notes.length && notes[nextNote].seg-segI<=ahead){
    const n=notes[nextNote]; const t=noteText(n);
    let speak=t.speak;
    showNote(n,t);
    nextNote++;
    if(n.into && nextNote<notes.length){ const n2=notes[nextNote], t2=noteText(n2); speak+=', into '+t2.speak; upcoming={n:n2,t:t2}; nextNote++; }
    else upcoming=null;
    say(speak);
  }
  if(curNote){
    curNoteT+=1/60;
    if(segI>curNote.end || curNoteT>D.noteHold){
      if(upcoming && segI<=upcoming.n.end+2){ showNote(upcoming.n,upcoming.t); upcoming=null; }
      else hideNote();
    }
  }
  const nn=$('nNext');
  if(upcoming){ nn.textContent='into '+upcoming.t.main.toLowerCase(); nn.classList.add('show'); } else nn.classList.remove('show');
  // Rookie: shout BRAKE when you are coming in too hot
  let w=false;
  if(D.warn && state==='run'){
    for(let k=Math.max(0,nextNote-3);k<Math.min(notes.length,nextNote+1);k++){
      const n=notes[k]; if(n.type!=='corner') continue;
      const dist=(n.seg-segI)*SEG_LEN; if(dist<-SEG_LEN*4 || segI>n.end) continue;
      const need=safeSp(SEV_CURVE[n.sev],ST.grip)*0.97*MAXS;
      if(speed<=need) continue;
      const dec=BRAKE*(0.55+0.45*ST.grip);
      const brakeDist=(speed*speed-need*need)/(2*dec)+SEG_LEN*5;
      if(dist<brakeDist){ w=true; break; }
    }
  }
  $('warn').classList.toggle('show',w);
}
function showNote(n,t){
  curNote=n; curNoteT=0;
  const el=$('note');
  el.classList.toggle('noglyph',!D.glyph);
  $('nMain').textContent=t.main;
  const m=$('nMod'); m.textContent=t.mod; m.classList.toggle('warnc',!!t.warn);
  if(D.glyph) drawGlyph(n);
  el.classList.add('show');
}
function hideNote(){ curNote=null; $('note').classList.remove('show'); }
function drawGlyph(n){
  const g=$('noteCv').getContext('2d'); g.clearRect(0,0,128,128);
  g.lineCap='round'; g.lineJoin='round';
  const stroke=(pathFn)=>{ g.strokeStyle='#0a1220'; g.lineWidth=20; pathFn(); g.stroke(); g.strokeStyle='#fff'; g.lineWidth=12; pathFn(); g.stroke(); };
  if(n.type==='crest'){
    stroke(()=>{ g.beginPath(); g.moveTo(14,92); g.quadraticCurveTo(64,10,114,92); });
    if(n.jump){ g.fillStyle='#ffd24a'; g.font='700 40px sans-serif'; g.textAlign='center'; g.fillText('!',64,84); }
    return;
  }
  const turn=[0,0.96,0.72,0.55,0.4,0.27,0.15][n.sev]*Math.PI*n.dir;
  const pts=[]; let x=64-n.dir*16, y=114, h=-Math.PI/2; const L=96, steps=24;
  for(let i=0;i<=steps;i++){ pts.push([x,y]); const seg=L/steps; const f=i/steps;
    const k = f<0.35?0 : (f<0.9? turn/(steps*0.55) : 0); h+=k; x+=Math.cos(h)*seg; y+=Math.sin(h)*seg; }
  stroke(()=>{ g.beginPath(); pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])); });
  const e=pts[pts.length-1], b=pts[pts.length-3], a=Math.atan2(e[1]-b[1],e[0]-b[0]);
  const head=()=>{ g.beginPath(); g.moveTo(e[0]+Math.cos(a)*14,e[1]+Math.sin(a)*14);
    g.lineTo(e[0]+Math.cos(a+2.4)*18,e[1]+Math.sin(a+2.4)*18); g.lineTo(e[0]+Math.cos(a-2.4)*18,e[1]+Math.sin(a-2.4)*18); g.closePath(); };
  g.fillStyle='#0a1220'; head(); g.lineWidth=8; g.strokeStyle='#0a1220'; g.stroke(); g.fill();
  g.fillStyle='#fff'; head(); g.fill();
  g.fillStyle=n.sev<=2?'#ff7a7a':'#ffd24a'; g.font='700 30px sans-serif'; g.textAlign='center';
  g.fillText(n.sev===1?'H':String(n.sev), n.dir<0?104:24, 34);
}

/* ================= voice + engine ================= */
let voiceOn=true, soundOn=true, voicePick=null;
function pickVoice(){ try{ const vs=window.speechSynthesis.getVoices();
  voicePick=vs.find(v=>/en-GB/i.test(v.lang)&&/male|daniel|arthur|oliver/i.test(v.name))||vs.find(v=>/en-GB/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null; }catch(e){} }
if(window.speechSynthesis){ pickVoice(); try{ window.speechSynthesis.onvoiceschanged=pickVoice; }catch(e){} }
function say(text){
  if(!voiceOn) return;
  try{ const ss=window.speechSynthesis; if(!ss) return;
    if(ss.pending) ss.cancel();
    const u=new SpeechSynthesisUtterance(text); u.rate=1.18; u.pitch=1; u.volume=1; if(voicePick) u.voice=voicePick; ss.speak(u);
  }catch(e){}
}
let AC=null, eng=null;
function audioInit(){
  if(AC) { try{ AC.resume(); }catch(e){} return; }
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    const o1=AC.createOscillator(); o1.type='sawtooth';
    const o2=AC.createOscillator(); o2.type='square';
    const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=700; f.Q.value=4;
    const g=AC.createGain(); g.gain.value=0;
    o1.connect(f); o2.connect(f); f.connect(g); g.connect(AC.destination); o1.start(); o2.start();
    const buf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    const ns=AC.createBufferSource(); ns.buffer=buf; ns.loop=true;
    const nf=AC.createBiquadFilter(); nf.type='bandpass'; nf.frequency.value=1300; nf.Q.value=.7;
    const ng=AC.createGain(); ng.gain.value=0; ns.connect(nf); nf.connect(ng); ng.connect(AC.destination); ns.start();
    eng={o1,o2,f,g,ng};
  }catch(e){ AC=null; eng=null; }
}
function audioUpdate(){
  if(!eng||!AC) return;
  const on=soundOn && at('game') && (state==='run'||state==='done'||state==='count');
  const sp=speed/MAXS;
  const within=clamp(sp*6.2-(gear-1),0,1);
  const rpm=state==='count' ? 0.35+0.25*Math.sin(performance.now()/180) : 0.25+0.75*within;
  const now=AC.currentTime;
  eng.o1.frequency.setTargetAtTime(55+rpm*170+gear*6,now,0.04);
  eng.o2.frequency.setTargetAtTime((55+rpm*170+gear*6)/2,now,0.04);
  eng.f.frequency.setTargetAtTime(500+rpm*1600,now,0.05);
  eng.g.gain.setTargetAtTime(on?0.035+0.03*(gasHeld||D.autoGas?1:0):0,now,0.06);
  eng.ng.gain.setTargetAtTime(on&&airT<=0? sp*(ST.surface==='Snow'?0.035:0.06):0,now,0.08);
}

/* ================= renderer ================= */
const view=$('view'); let ctx=view.getContext('2d');
let VW=0,VH=0,DPR=1,HZ=0,KX=0,night=null;
const COL={};
function fit(){
  const r=view.getBoundingClientRect(); const W=r.width||view.clientWidth, H=r.height||view.clientHeight;
  if(!W||!H) return;
  DPR=Math.min(window.devicePixelRatio||1,2);
  view.width=Math.round(W*DPR); view.height=Math.round(H*DPR); ctx.setTransform(DPR,0,0,DPR,0,0);
  VW=W; VH=H; setFrame();
  night=null;
}
window.addEventListener('resize',()=>{ if(at('game')) fit(); if(parts.length||confRaf) sizeCv(); });
function setFrame(){
  KX=Math.min(VW*0.58, VH*0.42);
  HZ=Math.round(clamp(VH*0.80-KX, VH*0.30, VH*0.46));
}
function prepColors(){
  COL.fog=hex(ST.fog);
  for(const k of ['ground','verge','road']) COL[k]=ST[k].map(hex);
  COL.track=hex(ST.track); COL.edge=hex(ST.edge);
}
function nightMask(){
  if(night && night.w===VW && night.h===VH) return night.c;
  const c=oc(Math.round(VW*DPR),Math.round(VH*DPR)), g=c.getContext('2d'); g.scale(DPR,DPR);
  g.fillStyle='rgba(2,4,12,.94)'; g.fillRect(0,0,VW,VH);
  g.globalCompositeOperation='destination-out';
  g.save(); g.translate(VW/2,HZ+KX*0.62); g.scale(1.55,0.62);
  const rg=g.createRadialGradient(0,0,KX*0.1,0,0,KX*1.25);
  rg.addColorStop(0,'rgba(0,0,0,1)'); rg.addColorStop(.45,'rgba(0,0,0,.93)'); rg.addColorStop(.75,'rgba(0,0,0,.45)'); rg.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=rg; g.beginPath(); g.arc(0,0,KX*1.25,0,6.283); g.fill(); g.restore();
  const lg=g.createLinearGradient(0,HZ+KX*0.8,0,VH);
  lg.addColorStop(0,'rgba(0,0,0,0)'); lg.addColorStop(1,'rgba(0,0,0,.55)');
  g.fillStyle=lg; g.fillRect(0,HZ+KX*0.8,VW,VH);
  g.globalCompositeOperation='source-over';
  night={c,w:VW,h:VH}; return c;
}
function project(p,cx,cy,cz){
  p.c.x=(p.w.x||0)-cx; p.c.y=p.w.y-cy; p.c.z=p.w.z-cz;
  p.s.scale=CAM_D/p.c.z;
  p.s.x=VW/2+p.s.scale*p.c.x*KX;
  p.s.y=Math.round(HZ-p.s.scale*p.c.y*KX);
  p.s.w=p.s.scale*ROAD_W*KX;
}
function quad(x1,y1,w1,x2,y2,w2,col){
  ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(x1-w1,y1); ctx.lineTo(x1+w1,y1); ctx.lineTo(x2+w2,y2); ctx.lineTo(x2-w2,y2); ctx.closePath(); ctx.fill();
}
function strip(p1,p2,off,hw,col){
  ctx.fillStyle=col; ctx.beginPath();
  ctx.moveTo(p1.x+(off-hw)*p1.w,p1.y); ctx.lineTo(p1.x+(off+hw)*p1.w,p1.y);
  ctx.lineTo(p2.x+(off+hw)*p2.w,p2.y); ctx.lineTo(p2.x+(off-hw)*p2.w,p2.y); ctx.closePath(); ctx.fill();
}
function drawBackground(){
  const art=stageArt(ST);
  ctx.drawImage(art.sky, ((-bgOff*0.15)%1024+1024)%1024 - 1024, 0, 1024, HZ+4);
  ctx.drawImage(art.sky, ((-bgOff*0.15)%1024+1024)%1024, 0, 1024, HZ+4);
  if(VW>1024) ctx.drawImage(art.sky, ((-bgOff*0.15)%1024+1024)%1024+1024, 0, 1024, HZ+4);
  // sun / moon
  const s=ST.sun, sx=((s.x*VW - bgOff*0.25)%(VW*1.6)+VW*1.6)%(VW*1.6)-VW*0.3, sy=HZ*s.y, sr=Math.max(VW,VH)*s.r;
  const gl=ctx.createRadialGradient(sx,sy,sr*0.2,sx,sy,sr*(s.moon?4:7));
  gl.addColorStop(0,'rgba('+s.c+','+(s.moon?.5:.85)+')'); gl.addColorStop(.25,'rgba('+s.c+','+(s.moon?.15:.35)+')'); gl.addColorStop(1,'rgba('+s.c+',0)');
  ctx.fillStyle=gl; ctx.fillRect(sx-sr*7,sy-sr*7,sr*14,sr*14);
  ctx.fillStyle='rgba('+s.c+',1)'; ctx.beginPath(); ctx.arc(sx,sy,sr*(s.moon?0.9:0.55),0,6.283); ctx.fill();
  if(s.moon){ ctx.fillStyle='rgba(150,160,190,.35)'; ctx.beginPath(); ctx.arc(sx-sr*.25,sy-sr*.15,sr*.2,0,6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(sx+sr*.3,sy+sr*.25,sr*.14,0,6.283); ctx.fill(); }
  // mountains + tree line
  const layer=(img,hh,f,dy)=>{ const dw=img.width*(hh/img.height); let o=((-bgOff*f*(KX/190))%dw+dw)%dw-dw;
    for(let x=o;x<VW;x+=dw) ctx.drawImage(img,x,HZ-hh+dy,dw,hh); };
  layer(art.far,KX*0.72,0.35,2);
  layer(art.near,KX*0.36,0.8,3);
  // haze at the horizon
  const hz=ctx.createLinearGradient(0,HZ-KX*0.25,0,HZ+2);
  hz.addColorStop(0,'rgba('+COL.fog.join(',')+',0)'); hz.addColorStop(1,'rgba('+COL.fog.join(',')+','+(ST.time==='night'?.0:.55)+')');
  ctx.fillStyle=hz; ctx.fillRect(0,HZ-KX*0.25,VW,KX*0.25+2);
  ctx.fillStyle=mixc(COL.ground[0],COL.fog,ST.fogD); ctx.fillRect(0,HZ,VW,VH-HZ);
}
function drawSprite(img,scale,sx,sy,ww,clipY,fog,alpha){
  const destW=ww*scale*ROAD_W*KX, destH=destW*img.height/img.width;
  if(destW<0.8) return;
  const dx=sx-destW/2, dy=sy-destH;
  if(dx>VW||dx+destW<0) return;
  const clipH=clipY?Math.max(0,dy+destH-clipY):0;
  if(clipH>=destH) return;
  ctx.globalAlpha=alpha*(1-Math.pow(fog,2.2)*0.85);
  ctx.drawImage(img,0,0,img.width,img.height-img.height*clipH/destH,dx,dy,destW,destH-clipH);
  ctx.globalAlpha=1;
}
function render(){
  const W=VW,H=VH; if(!W||!segs.length) return;
  ctx.save();
  const sp=speed/MAXS;
  const jit = state==='run' ? sp*(ST.surface==='Snow'?0.8:1.6) : 0;
  ctx.translate((Math.random()-.5)*(jit+shake*12),(Math.random()-.5)*(jit+shake*10));
  const base=findSeg(pos), basePct=(pos%SEG_LEN)/SEG_LEN;
  const pseg=findSeg(pos+PLAYER_Z), ppct=((pos+PLAYER_Z)%SEG_LEN)/SEG_LEN;
  const playerY=lerp(pseg.p1.w.y,pseg.p2.w.y,ppct);
  const camRoadY=lerp(base.p1.w.y,base.p2.w.y,basePct);
  const camY=Math.max(playerY, camRoadY-CAM_H*0.25)+CAM_H;
  drawBackground();
  let maxy=H, x=0, dx=-(base.curve*basePct);
  const dd=ST.draw;
  for(let n=0;n<dd;n++){
    const seg=segs[base.i+n]; if(!seg) break;
    seg.fog=Math.pow(n/dd,1.5)*ST.fogD;
    project(seg.p1, px*ROAD_W - x, camY, pos);
    project(seg.p2, px*ROAD_W - x - dx, camY, pos);
    x+=dx; dx+=seg.curve;
    seg.clip=maxy;
    const p1=seg.p1.s, p2=seg.p2.s;
    if(seg.p1.c.z<=CAM_D || p2.y>=p1.y || p2.y>=maxy) continue;
    const f=seg.fog, b=seg.band;
    ctx.fillStyle=mixc(COL.ground[b],COL.fog,f); ctx.fillRect(0,p2.y,W,p1.y-p2.y);
    quad(p1.x,p1.y,p1.w*1.24,p2.x,p2.y,p2.w*1.24,mixc(COL.verge[b],COL.fog,f));
    quad(p1.x,p1.y,p1.w,p2.x,p2.y,p2.w,mixc(COL.road[b],COL.fog,f));
    strip(p1,p2,-0.985,0.025,mixc(COL.edge,COL.fog,f)); strip(p1,p2,0.985,0.025,mixc(COL.edge,COL.fog,f));
    strip(p1,p2,-0.42,0.09,mixc(COL.track,COL.fog,f)); strip(p1,p2,0.42,0.09,mixc(COL.track,COL.fog,f));
    maxy=p2.y;
  }
  // sprites, far to near
  const rz=state==='idle'||state==='count'?-1:rivalZAt(raceT);
  const rsegI=Math.floor(rz/SEG_LEN);
  for(let n=dd-1;n>0;n--){
    const seg=segs[base.i+n]; if(!seg) continue;
    if(seg.p1.c.z<=CAM_D) continue;
    const p=seg.p1.s;
    for(const o of seg.spr) drawSprite(o.img,p.scale,p.x+o.off*p.w,p.y,o.ww,seg.clip,seg.fog,1);
    if(seg.gate) drawGate(seg);
    if(seg.i===rsegI && rz>pos+PLAYER_Z+SEG_LEN*2){
      const rx=Math.sin(rz/2600)*0.28 - seg.curve*0.05;
      const imgs=ST.time==='night'?CARS.rivN:CARS.riv;
      const li=clamp(Math.round(2-seg.curve*0.4),0,4);
      drawSprite(imgs[li],p.scale,p.x+rx*p.w,p.y,CAR_IMG_WW,seg.clip,seg.fog,1);
      if(ST.time==='night'){ const s=p.scale*ROAD_W*KX*CAR_IMG_WW; glowTail(p.x+rx*p.w,p.y-s*0.45,s,0.9); }
    }
  }
  if(ST.time==='night') ctx.drawImage(nightMask(),0,0,W,H);
  drawCar();
  drawDust();
  if(ST.scen==='snow') drawSnow();
  ctx.restore();
}
function drawGate(seg){
  const p=seg.p1.s, w=p.w, x=p.x, y=p.y;
  if(w<2) return;
  const postW=w*0.05, ht=w*0.75;
  if(y-ht>seg.clip) return;
  ctx.globalAlpha=1-Math.pow(seg.fog,2)*0.8;
  ctx.fillStyle='#d9dde5'; ctx.fillRect(x-w*1.12-postW/2,y-ht,postW,ht); ctx.fillRect(x+w*1.12-postW/2,y-ht,postW,ht);
  const bh=w*0.16, by=y-ht;
  if(seg.gate==='finish'){
    const n=16, cw=(w*2.3)/n;
    for(let i=0;i<n;i++) for(let j=0;j<2;j++){ ctx.fillStyle=(i+j)%2?'#111':'#fff'; ctx.fillRect(x-w*1.15+i*cw,by+j*bh/2,cw+0.5,bh/2+0.5); }
  } else {
    ctx.fillStyle='#d8283f'; ctx.fillRect(x-w*1.15,by,w*2.3,bh);
    ctx.fillStyle='#fff'; ctx.font='700 '+Math.max(6,Math.round(bh*0.7))+'px '+"'Space Grotesk',sans-serif";
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(ST.ss+' · START',x,by+bh/2);
  }
  ctx.globalAlpha=1;
}
function glowTail(cx,cy,carW,a){
  for(const s of [-1,1]){ const x=cx+s*carW*0.32, y=cy;
    const g=ctx.createRadialGradient(x,y,1,x,y,carW*0.22);
    g.addColorStop(0,'rgba(255,60,70,'+a+')'); g.addColorStop(1,'rgba(255,40,50,0)');
    ctx.fillStyle=g; ctx.fillRect(x-carW*0.22,y-carW*0.22,carW*0.44,carW*0.44); }
}
function carGeom(){
  const w=CAR_IMG_WW*2*KX, h=w*212/320;
  const lift = airT>0 ? Math.sin(Math.PI*(1-airT/Math.max(airMax,0.01)))*KX*0.22 : 0;
  const bob = state==='run' ? Math.sin(performance.now()/38)*(speed/MAXS)*(ST.surface==='Snow'?0.6:1.4) : 0;
  const bottom=HZ+KX*1.0+h*0.06;
  return {w,h,x:VW/2-w/2,y:bottom-h-lift+bob,lift};
}
function drawCar(){
  const g=carGeom();
  const lean=clamp(steerVal*0.75+latV*0.25,-1,1);
  const imgs=ST.time==='night'?CARS.meN:CARS.me;
  const li=clamp(Math.round((lean+1)*2),0,4);
  if(g.lift>0){ ctx.fillStyle='rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(VW/2,g.y+g.h+g.lift,g.w*0.45*(1-g.lift/(KX*0.5)),g.h*0.05,0,0,6.283); ctx.fill(); }
  ctx.drawImage(imgs[li],g.x,g.y,g.w,g.h);
  const braking=(brakeHeld||state==='done');
  if(braking||ST.time==='night') glowTail(VW/2+lean*g.w*0.02,g.y+g.h*0.545,g.w,braking?0.85:0.45);
  if(flameT>0){ const fx=g.x+g.w*(246/320), fy=g.y+g.h*(166/212);
    const fg=ctx.createRadialGradient(fx,fy,1,fx,fy,g.w*0.07); fg.addColorStop(0,'rgba(255,255,220,1)'); fg.addColorStop(.4,'rgba(255,170,40,.9)'); fg.addColorStop(1,'rgba(255,80,0,0)');
    ctx.fillStyle=fg; ctx.beginPath(); ctx.arc(fx,fy,g.w*0.07,0,6.283); ctx.fill(); }
}
function drawDust(){
  const g=carGeom(), sp=speed/MAXS;
  const slide=Math.abs(latV)*0.6+Math.abs(steerVal)*sp*0.5+sliding*2;
  if(state==='run'||state==='done'){
    const nSp=airT>0?0:Math.floor((sp*2.2+slide*1.5)*(Math.abs(px)>1?2:1)+Math.random());
    for(let i=0;i<nSp;i++){ const side=Math.random()<.5?-1:1;
      dust.push({x:VW/2+side*g.w*0.36, y:g.y+g.h*0.93, vx:side*(20+Math.random()*80)-latV*90, vy:-(10+Math.random()*30)+sp*40,
        r:g.w*0.05, a:0.30+Math.random()*0.2, life:0.9}); }
  }
  const dt=1/60;
  for(const d of dust){ d.x+=d.vx*dt; d.y+=d.vy*dt; d.r+=g.w*0.22*dt; d.a-=dt*0.42; }
  dust=dust.filter(d=>d.a>0.01).slice(-140);
  for(const d of dust){
    const gr=ctx.createRadialGradient(d.x,d.y,1,d.x,d.y,d.r);
    gr.addColorStop(0,'rgba('+ST.dust+','+d.a.toFixed(3)+')'); gr.addColorStop(1,'rgba('+ST.dust+',0)');
    ctx.fillStyle=gr; ctx.fillRect(d.x-d.r,d.y-d.r,d.r*2,d.r*2);
  }
}
function drawSnow(){
  const sp=speed/MAXS, dt=1/60;
  ctx.fillStyle='rgba(255,255,255,.85)';
  for(const f of flakes){
    const sx=(f.x-0.5), sy=(f.y-0.43);
    f.x+=sx*sp*dt*1.6*(0.5+f.z)+0.02*dt; f.y+=(0.05+f.z*0.08)*dt+sy*sp*dt*1.6*(0.5+f.z);
    if(f.x<0||f.x>1||f.y>1){ f.x=0.5+(Math.random()-.5)*0.5; f.y=0.3+Math.random()*0.25; f.z=Math.random(); }
    const r=0.6+f.z*2.2; ctx.beginPath(); ctx.arc(f.x*VW,f.y*VH,r,0,6.283); ctx.fill();
  }
}

function fmtT(t){ const m=Math.floor(t/60), s=t-m*60; return m+':'+(s<10?'0':'')+s.toFixed(1); }
function fmtDelta(d){ return (d>0?'+':d<0?'−':'±')+Math.abs(d).toFixed(1)+'s'; }
function bigMsg(t,c){ const el=$('bigmsg'); el.textContent=t; el.style.color=c||'#f4ead6'; el.classList.remove('show'); void el.offsetWidth; el.classList.add('show'); }

/* ================= loop + flow ================= */
let raf=null, lastT=0;
function loop(t){
  if(!at('game')){ raf=null; return; }
  const dt=Math.min(.04,(t-lastT)/1000||0); lastT=t;
  if(state==='count'){
    countT+=dt;
    const n=Math.min(3,Math.floor(countT/0.8));
    if(n!==lightsN){ lightsN=n; setLights(n); if(n>0&&n<3) say(String(4-n-1)); }
    if(countT>=3.0){ state='run'; setLights(4); say('Go!'); setTimeout(()=>$('lights').classList.remove('show'),700); }
  }
  step(dt);
  render(); hud(); audioUpdate();
  if((state==='done' && speed<MAXS*0.05) || state==='retired'){
    if(!resultShown){ resultShown=true; setTimeout(showResult, state==='retired'?1300:600); }
  }
  raf=requestAnimationFrame(loop);
}
function setLights(n){
  const ls=[...$('lights').children]; $('lights').classList.add('show');
  ls.forEach((l,i)=>{ l.className = n===4 ? 'g' : (i<n?'r':''); });
}
function startStage(i){
  buildArt(); stopConfetti();
  stageIdx=i; buildStage(STAGES[i],DIFFS[diffIdx]); prepColors(); resetRun();
  show('game'); fit();
  $('hRiv').textContent='vs '+ST.rival;
  $('gasBtn').classList.toggle('auto',D.autoGas); $('gasLab').textContent=D.autoGas?'AUTO':'GAS';
  hideNote(); $('nNext').classList.remove('show'); $('warn').classList.remove('show');
  state='count'; countT=0; lightsN=-1;
  bigMsg(ST.ss+' · '+ST.name,'#ffd24a');
  audioInit();
  say(ST.ss+', '+ST.name+'. Ready.');
  lastT=performance.now();
  if(raf) cancelAnimationFrame(raf);
  raf=requestAnimationFrame(loop);
}
function showResult(){
  const rt=rivalT[finishSeg];
  const done=state!=='retired', beat=done && finishT<rt;
  const stars=!done?0 : beat&&damage<30?3 : beat?2 : 1;
  $('resEmoji').textContent = !done?'🛠️' : beat?'🏆':'🏁';
  $('resTitle').textContent = !done?'Retired' : beat?'Stage win!':'Stage complete';
  $('resSub').textContent = !done ? 'Too much damage — the car could not go on. Listen for the tight corners and brake earlier.'
    : beat ? 'You beat '+ST.rival+' by '+(rt-finishT).toFixed(1)+' seconds on '+ST.name+'!'
    : ST.rival+' was '+(finishT-rt).toFixed(1)+'s quicker. Try braking a little later in the fast bends.';
  $('resStars').textContent=done?'★★★'.slice(0,stars).padEnd(3,'☆'):'';
  const key=ST.id+'_'+diffIdx; const best=getBest(key);
  if(done) saveBest(key,finishT,stars);

    '<div class="srow"><span class="k">🏁 Your time</span><span class="v">'+(done?fmtT(finishT):'—')+'</span></div>'+
    '<div class="srow"><span class="k">🧡 '+ST.rival+'</span><span class="v">'+fmtT(rt)+'</span></div>'+
    '<div class="srow"><span class="k">💥 Crashes</span><span class="v">'+crashes+'</span></div>'+
    '<div class="srow"><span class="k">🪂 Jumps</span><span class="v">'+jumps+'</span></div>'+
    '<div class="srow"><span class="k">🔧 Damage</span><span class="v">'+Math.round(damage)+'%</span></div>'+
    '<div class="srow tot"><span class="k">⭐ Best ('+DIFFS[diffIdx].name+')</span><span class="v">'+(nb?fmtT(nb.t):'—')+(done&&(!best||finishT<best.t)?' NEW':'')+'</span></div>';
  $('nextBtn').style.display=stageIdx<STAGES.length-1?'block':'none';
  if(beat) burst(2400);

function getBest(k){ try{ const o=JSON.parse(localStorage.getItem('alexrally')||'{}'); return o[k]||null; }catch(e){ return null; } }
function saveBest(k,t,stars){ try{ const o=JSON.parse(localStorage.getItem('alexrally')||'{}'); const b=o[k];

function bindPedal(el,set){
  const on=()=>{ set(true); el.classList.add('on'); }, off=()=>{ set(false); el.classList.remove('on'); };
  el.addEventListener('pointerdown',e=>{ on(); try{el.setPointerCapture(e.pointerId);}catch(_){}; e.preventDefault(); });
  el.addEventListener('pointerup',off); el.addEventListener('pointercancel',off);
  el.addEventListener('touchstart',e=>{ on(); e.preventDefault(); },{passive:false});
  el.addEventListener('touchend',e=>{ if(e.targetTouches.length===0) off(); e.preventDefault(); },{passive:false});
  el.addEventListener('touchcancel',off);
}

window.__rally={ STAGES, DIFFS, SEV_CURVE, MAXS, SEG_LEN, PLAYER_Z, CAR_HALF, KMH,
