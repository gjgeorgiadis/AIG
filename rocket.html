<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#04060f">
<title>Alexander's Rocket Racer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#04060f; --deep:#0a1024; --surface:#121a33; --surface2:#1b2749; --bone:#f4ead6;
  --muted:#93a4c8; --lime:#c6ff4a; --gold:#ffd24a; --aqua:#5ce1e6; --coral:#ff5c7a;
  --hot:#ff7a29; --hull:#57e08a;
  --display:'Space Grotesk', system-ui, sans-serif; --mono:ui-monospace,'SF Mono',Menlo,monospace;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; height:100%; overscroll-behavior:none; }
body{ font-family:var(--display); color:var(--bone); position:fixed; inset:0; overflow:hidden;
  background:radial-gradient(1200px 800px at 50% -10%, #16204a 0%, var(--ink) 62%) fixed, var(--ink); }
#app{ position:relative; height:100svh; height:100dvh; width:100%; max-width:560px; margin:0 auto;
  display:flex; flex-direction:column; overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
.screen{ position:absolute; inset:0; display:none; flex-direction:column;
  padding:clamp(13px,3.6vw,26px) clamp(13px,3.6vw,26px) calc(clamp(9px,2.6vw,18px) + env(safe-area-inset-bottom)); }
.screen.active{ display:flex; }
.eyebrow{ font-weight:600; letter-spacing:.22em; text-transform:uppercase; font-size:clamp(10px,2.7vw,12px);
  color:var(--muted); text-align:center; }
.btn{ font-family:var(--display); font-weight:700; font-size:clamp(16px,4.2vw,20px); color:var(--ink);
  background:var(--bone); border:none; border-radius:16px; padding:15px 18px; width:100%; cursor:pointer;
  box-shadow:0 6px 0 #b9ad94, 0 10px 22px #0008; }
.btn:active{ transform:translateY(4px); box-shadow:0 2px 0 #b9ad94; }
.btn.ghost{ background:var(--surface2); color:var(--bone); box-shadow:inset 0 0 0 1.5px #ffffff1c; }
.menu{ width:100%; max-width:330px; display:flex; flex-direction:column; gap:10px; margin:0 auto; }

/* ---------- home ---------- */
#home{ justify-content:center; align-items:center; text-align:center; gap:clamp(8px,1.9vh,16px); }
.title{ line-height:.88; letter-spacing:-.03em; }
.title .small{ display:block; font-size:clamp(16px,4.8vw,23px); color:var(--muted); font-weight:600; letter-spacing:0; }
.title .big{ display:block; font-size:clamp(34px,11.5vw,60px); font-weight:700; }
.title .big b{ color:var(--aqua); } .title .big i{ color:var(--hot); font-style:normal; }
.alex{ width:clamp(74px,19vw,96px); height:clamp(74px,19vw,96px); border-radius:50%; object-fit:cover;
  box-shadow:0 0 0 4px var(--surface2), 0 10px 26px #000a; }
.cap{ color:var(--muted); font-weight:600; font-size:clamp(12px,3.2vw,14px); }
.diffs{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; width:100%; max-width:330px; margin:0 auto; }
.diff{ font-family:var(--display); font-weight:700; color:var(--ink); border:none; border-radius:14px;
  padding:11px 4px; cursor:pointer; box-shadow:0 5px 0 #b9ad94, 0 8px 16px #0007; }
.diff:active{ transform:translateY(3px); box-shadow:0 2px 0 #b9ad94; }
.diff .em{ display:block; font-size:1.4em; line-height:1.15; }
.diff .lvl{ display:block; font-size:clamp(10px,2.7vw,12px); }
.diff.d0{ background:#a8e9f6; } .diff.d1{ background:var(--gold); } .diff.d2{ background:#ff9a7a; }

/* ---------- briefing ---------- */
#brief{ justify-content:center; align-items:center; text-align:center; gap:12px; }
#briefCv{ width:clamp(120px,34vw,168px); height:clamp(120px,34vw,168px); }
.pl-name{ font-weight:700; font-size:clamp(26px,7.4vw,36px); letter-spacing:-.01em; }
.pl-line{ color:var(--muted); font-weight:600; font-size:clamp(13px,3.6vw,15px); max-width:330px; }
.pl-chips{ display:flex; gap:7px; flex-wrap:wrap; justify-content:center; }
.chip{ background:var(--surface); border-radius:12px; padding:7px 11px; font-weight:700;
  font-size:clamp(11px,3vw,13px); box-shadow:inset 0 0 0 1.5px #ffffff12; }

/* ---------- game ---------- */
#game{ padding:calc(env(safe-area-inset-top) + 5px) 7px calc(env(safe-area-inset-bottom) + 5px); gap:5px; }
.hud{ display:flex; align-items:center; gap:6px; }
.iconbtn{ font-weight:700; font-size:15px; color:var(--bone); background:var(--surface); border:none;
  border-radius:10px; width:34px; height:34px; cursor:pointer; box-shadow:inset 0 0 0 1.5px #ffffff14; flex:none; }
.pill{ background:var(--surface); border-radius:10px; padding:4px 8px; box-shadow:inset 0 0 0 1.5px #ffffff10;
  text-align:center; flex:1; min-width:0; }
.pill .k{ display:block; color:var(--muted); font-weight:600; font-size:clamp(7px,2vw,9px);
  letter-spacing:.11em; text-transform:uppercase; }
.pill .v{ display:block; font-family:var(--mono); font-weight:700; font-size:clamp(12px,3.4vw,16px); line-height:1.15; }
.shields{ display:flex; gap:2px; justify-content:center; font-size:clamp(9px,2.6vw,12px); line-height:1; }
.sh{ transition:opacity .2s, transform .2s; }
.sh.gone{ opacity:.22; transform:scale(.8); filter:grayscale(1); }
.trackbar{ position:relative; height:9px; border-radius:6px; background:#0008; overflow:hidden;
  box-shadow:inset 0 0 0 1px #ffffff12; }
.trackbar i{ position:absolute; left:0; top:0; bottom:0; width:0%;
  background:linear-gradient(90deg,#2a5f8f,var(--aqua)); }
.trackbar .me,.trackbar .riv{ position:absolute; top:50%; width:11px; height:11px; margin-top:-5.5px; margin-left:-5.5px;
  border-radius:50%; font-size:8px; display:flex; align-items:center; justify-content:center; }
.trackbar .me{ background:var(--gold); box-shadow:0 0 7px var(--gold); }
.trackbar .riv{ background:var(--coral); box-shadow:0 0 7px var(--coral); }
.stage{ position:relative; flex:1; min-height:0; display:flex; align-items:center; justify-content:center; }
canvas#view{ border-radius:16px; display:block; touch-action:none; -ms-touch-action:none;
  overscroll-behavior:none; box-shadow:0 14px 36px #000b; }
.bigmsg{ position:absolute; left:50%; top:40%; transform:translate(-50%,-50%); font-weight:700;
  font-size:clamp(28px,9vw,48px); pointer-events:none; opacity:0; text-shadow:0 4px 20px #000c; text-align:center; }
.bigmsg.show{ animation:bm .9s ease-out; }
@keyframes bm{ 0%{opacity:0;transform:translate(-50%,-50%) scale(.6);} 22%{opacity:1;transform:translate(-50%,-50%) scale(1.12);}
  70%{opacity:1;} 100%{opacity:0;transform:translate(-50%,-50%) scale(1);} }
.controls{ display:flex; align-items:flex-end; gap:9px; }
.thr{ flex:1; display:flex; flex-direction:column; }
.thr-lab{ text-align:center; font-weight:700; font-size:clamp(9px,2.5vw,11px); color:var(--muted);
  letter-spacing:.07em; text-transform:uppercase; margin-bottom:5px; }
.thr-track{ position:relative; height:clamp(52px,14vw,66px); border-radius:18px; background:#080d1c;
  box-shadow:inset 0 0 0 1.5px #ffffff18, inset 0 3px 9px #000a; overflow:hidden; cursor:pointer;
  touch-action:none; }
.thr-fill{ position:absolute; top:0; bottom:0; left:0; width:0%;
  background:linear-gradient(90deg,#e0431a,var(--hot) 45%,#ffd98a); transition:width .05s linear; }
.thr-ticks{ position:absolute; inset:0; pointer-events:none;
  background:repeating-linear-gradient(90deg,#ffffff22 0 1px,transparent 1px 22px); }
.thr-knob{ position:absolute; top:8%; bottom:8%; width:12px; margin-left:-6px; left:0%; border-radius:7px;
  background:linear-gradient(180deg,#fffdf6,#c8cede); box-shadow:0 2px 6px #000a, inset 0 0 0 1px #0004;
  transition:left .05s linear; pointer-events:none; }
.thr-val{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-family:var(--mono); font-weight:700; font-size:clamp(14px,3.9vw,18px); text-shadow:0 2px 7px #000c;
  pointer-events:none; }

/* ---------- result ---------- */
#result{ justify-content:center; gap:9px; text-align:center; overflow-y:auto; }
.res-emoji{ font-size:clamp(38px,12vw,58px); line-height:1; }
.res-title{ font-weight:700; font-size:clamp(21px,6.2vw,31px); }
.res-sub{ color:var(--muted); font-weight:600; font-size:clamp(12px,3.3vw,14px); margin-top:-3px; }
.stars{ font-size:clamp(24px,7.4vw,34px); letter-spacing:4px; height:1.2em; }
.stats{ width:100%; max-width:330px; margin:0 auto; background:var(--surface); border-radius:15px; padding:9px 12px;
  box-shadow:inset 0 0 0 1.5px #ffffff10; }
.srow{ display:flex; justify-content:space-between; padding:3px 0; font-weight:600; font-size:clamp(12px,3.3vw,14px); }
.srow .k{ color:var(--muted); } .srow .v{ font-family:var(--mono); font-weight:700; }
.srow.tot{ border-top:1.5px solid #ffffff1a; margin-top:4px; padding-top:7px; font-size:clamp(14px,4vw,17px); }
.srow.tot .v{ color:var(--lime); }
.best{ font-family:var(--mono); font-weight:700; color:var(--gold); font-size:clamp(12px,3.2vw,14px); }
#confetti{ position:absolute; inset:0; z-index:60; pointer-events:none; display:none; }
@media (min-width:600px){ #app{ height:96svh; margin-top:2svh; border-radius:32px; box-shadow:0 40px 120px #000b, inset 0 0 0 1px #ffffff0d; } }
#backToMenu{ position:fixed; top:calc(env(safe-area-inset-top,0px) + 8px); left:8px; z-index:90;
  font:700 14px var(--display,-apple-system,sans-serif); color:#fff; background:rgba(0,0,0,.5);
  padding:7px 13px; border-radius:999px; text-decoration:none; -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); }
#backToMenu:active{ background:rgba(0,0,0,.7); }
</style>
</head>

</div>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const app=$('app');
const SCREENS=['home','brief','game','result'];
function show(n){ SCREENS.forEach(s=>$(s).classList.toggle('active',s===n)); app.dataset.screen=n; }
const at=s=>app.dataset.screen===s;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
let rng=Math.random;
const rnd=(a,b)=>a+rng()*(b-a);
const ri=n=>Math.floor(rng()*n);

/* ================= confetti ================= */
const cv=$('confetti'), cctx=cv.getContext('2d'); let parts=[], confRaf=null, confUntil=0;
function sizeCv(){ const r=app.getBoundingClientRect(); cv.width=r.width; cv.height=r.height; }
function burst(ms){
  sizeCv(); cv.style.display='block';
  const cols=['#ffd24a','#5ce1e6','#c6ff4a','#f4ead6','#ff7a29'];
  for(let i=0;i<115;i++) parts.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.4,
    vx:(Math.random()-.5)*1.6, vy:2+Math.random()*3.2, s:6+Math.random()*9,
    rot:Math.random()*6.28, vr:(Math.random()-.5)*.34, c:cols[Math.floor(Math.random()*cols.length)]});
  confUntil=performance.now()+ms; if(!confRaf) confLoop();
}
function confLoop(){
  cctx.clearRect(0,0,cv.width,cv.height);
  for(const p of parts){ p.x+=p.vx; p.y+=p.vy; p.vy+=.045; p.rot+=p.vr;
    cctx.save(); cctx.translate(p.x,p.y); cctx.rotate(p.rot); cctx.fillStyle=p.c;
    cctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); cctx.restore(); }
  parts=parts.filter(p=>p.y<cv.height+40);
  if(performance.now()<confUntil||parts.length) confRaf=requestAnimationFrame(confLoop);
  else { confRaf=null; cctx.clearRect(0,0,cv.width,cv.height); cv.style.display='none'; }
}
function stopConfetti(){ parts=[]; if(confRaf){ cancelAnimationFrame(confRaf); confRaf=null; }
  cctx.clearRect(0,0,cv.width,cv.height); cv.style.display='none'; }

/* ==================================================================
   PRE-RENDERED ART  — every rock, shard and planet is drawn once at
   high detail into an offscreen canvas, then blitted with scaling.
   Detail stays cheap no matter how much is on screen.
   ================================================================== */
function oc(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function lump(g,n,r,jitter,seed){        // irregular closed blob
  let s=seed;
  const rr=()=>{ s=(s*16807)%2147483647; return s/2147483647; };
  g.beginPath();
  for(let i=0;i<n;i++){
    const a=i/n*6.283, rad=r*(1-jitter+rr()*jitter*2);
    const x=Math.cos(a)*rad, y=Math.sin(a)*rad*0.94;
    if(i) g.lineTo(x,y); else g.moveTo(x,y);
  }
  g.closePath();
}
function makeRock(S,base,dark,light,seed){
  const c=oc(S,S), g=c.getContext('2d'); g.translate(S/2,S/2);
  const R=S*0.46;
  g.save(); lump(g,13,R,0.19,seed);
  const grd=g.createRadialGradient(-R*0.35,-R*0.4,R*0.06,0,0,R*1.25);
  grd.addColorStop(0,light); grd.addColorStop(.45,base); grd.addColorStop(1,dark);
  g.fillStyle=grd; g.fill();
  g.clip();
  // craters
  let s=seed*7|0;
  const rr=()=>{ s=(s*48271)%2147483647; return s/2147483647; };
  for(let i=0;i<9;i++){
    const cx=(rr()-.5)*R*1.5, cy=(rr()-.5)*R*1.5, cr=R*(0.07+rr()*0.19);
    g.beginPath(); g.ellipse(cx,cy,cr,cr*0.86,rr()*3,0,6.283);
    g.fillStyle='rgba(0,0,0,.26)'; g.fill();
    g.beginPath(); g.ellipse(cx-cr*0.16,cy-cr*0.2,cr*0.78,cr*0.66,0,0,6.283);
    g.fillStyle='rgba(255,255,255,.10)'; g.fill();
  }
  // speckle
  for(let i=0;i<70;i++){
    g.fillStyle='rgba(255,255,255,'+(0.03+rr()*0.07).toFixed(3)+')';
    g.fillRect((rr()-.5)*R*2,(rr()-.5)*R*2,1.6,1.6);
  }
  g.restore();
  // rim light + shadow edge
  g.save(); lump(g,13,R,0.19,seed);
  g.strokeStyle='rgba(255,255,255,.30)'; g.lineWidth=S*0.012; g.stroke();
  g.clip();
  const sh=g.createLinearGradient(R*0.15,-R,R*1.1,R);
  sh.addColorStop(0,'rgba(0,0,0,0)'); sh.addColorStop(1,'rgba(0,0,0,.55)');
  g.fillStyle=sh; g.fillRect(-R*1.2,-R*1.2,R*2.4,R*2.4);
  g.restore();
  return c;
}
function makeIce(S,seed){
  const c=oc(S,S), g=c.getContext('2d'); g.translate(S/2,S/2);
  const R=S*0.45;
  let s=seed||3;
  const rr=()=>{ s=(s*16807)%2147483647; return s/2147483647; };
  g.save();
  lump(g,8,R,0.30,seed||5);
  const grd=g.createLinearGradient(-R,-R,R,R);
  grd.addColorStop(0,'rgba(226,250,255,.95)'); grd.addColorStop(.5,'rgba(122,205,240,.80)');
  grd.addColorStop(1,'rgba(60,140,200,.72)');
  g.fillStyle=grd; g.fill();
  g.clip();
  for(let i=0;i<7;i++){                     // facets
    g.beginPath();
    g.moveTo((rr()-.5)*R*2,(rr()-.5)*R*2);
    g.lineTo((rr()-.5)*R*2,(rr()-.5)*R*2);
    g.lineTo((rr()-.5)*R*2,(rr()-.5)*R*2);
    g.closePath();
    g.fillStyle='rgba(255,255,255,'+(0.07+rr()*0.16).toFixed(3)+')'; g.fill();
  }
  g.restore();
  g.save(); lump(g,8,R,0.30,seed||5);
  g.strokeStyle='rgba(240,253,255,.9)'; g.lineWidth=S*0.016; g.stroke(); g.restore();
  // inner glint
  g.beginPath(); g.ellipse(-R*0.25,-R*0.3,R*0.2,R*0.12,-0.6,0,6.283);
  g.fillStyle='rgba(255,255,255,.85)'; g.fill();
  return c;
}
function makeMetal(S,seed){
  const c=oc(S,S), g=c.getContext('2d'); g.translate(S/2,S/2);
  const R=S*0.42;
  g.save(); g.rotate(0.3);
  // main hull box
  const grd=g.createLinearGradient(-R,-R,R,R);
  grd.addColorStop(0,'#d8dfe8'); grd.addColorStop(.42,'#8d9aad'); grd.addColorStop(1,'#464f63');
  g.fillStyle=grd;
  g.fillRect(-R*0.62,-R*0.42,R*1.24,R*0.84);
  g.strokeStyle='rgba(20,26,40,.8)'; g.lineWidth=S*0.012;
  g.strokeRect(-R*0.62,-R*0.42,R*1.24,R*0.84);
  // solar panel wings
  for(const dir of [-1,1]){
    g.fillStyle='#20356b';
    g.fillRect(dir>0?R*0.62:-R*1.5, -R*0.3, R*0.88, R*0.6);
    g.strokeStyle='#8fb6ff'; g.lineWidth=S*0.008;
    for(let i=1;i<5;i++){
      const x=(dir>0?R*0.62:-R*1.5)+R*0.88*i/5;
      g.beginPath(); g.moveTo(x,-R*0.3); g.lineTo(x,R*0.3); g.stroke();
    }
    g.beginPath(); g.moveTo(dir>0?R*0.62:-R*1.5,-R*0.3);
    g.lineTo(dir>0?R*1.5:-R*0.62,-R*0.3); g.stroke();
  }
  // dish + rivets
  g.beginPath(); g.ellipse(0,-R*0.5,R*0.3,R*0.14,0,0,6.283);
  g.fillStyle='#c3ccdb'; g.fill(); g.strokeStyle='#5a6478'; g.lineWidth=S*0.01; g.stroke();
  g.fillStyle='rgba(30,36,52,.75)';
  for(let i=0;i<6;i++) g.fillRect(-R*0.5+i*R*0.2,-R*0.36,S*0.016,S*0.016);
  // scorch
  g.fillStyle='rgba(20,10,6,.45)';
  g.beginPath(); g.ellipse(R*0.2,R*0.12,R*0.26,R*0.16,0.4,0,6.283); g.fill();
  g.restore();
  return c;
}
function makeComet(S){
  const c=oc(S,S), g=c.getContext('2d'); g.translate(S/2,S/2);
  const R=S*0.30;
  const halo=g.createRadialGradient(0,0,R*0.15,0,0,R*2.2);
  halo.addColorStop(0,'rgba(255,255,255,.95)'); halo.addColorStop(.22,'rgba(160,240,255,.7)');
  halo.addColorStop(.55,'rgba(90,180,255,.28)'); halo.addColorStop(1,'rgba(60,120,255,0)');
  g.fillStyle=halo; g.beginPath(); g.arc(0,0,R*2.2,0,6.283); g.fill();
  lump(g,10,R*0.75,0.22,17);
  const grd=g.createRadialGradient(-R*0.2,-R*0.25,R*0.05,0,0,R);
  grd.addColorStop(0,'#ffffff'); grd.addColorStop(.6,'#cfefff'); grd.addColorStop(1,'#7fb6d8');
  g.fillStyle=grd; g.fill();
  return c;
}
function makeFuel(S){
  const c=oc(S,S), g=c.getContext('2d'); g.translate(S/2,S/2);
  const R=S*0.30;
  const halo=g.createRadialGradient(0,0,R*0.2,0,0,R*2.1);
  halo.addColorStop(0,'rgba(198,255,74,.85)'); halo.addColorStop(.5,'rgba(120,220,90,.30)');
  halo.addColorStop(1,'rgba(90,200,80,0)');
  g.fillStyle=halo; g.beginPath(); g.arc(0,0,R*2.1,0,6.283); g.fill();
  const grd=g.createLinearGradient(-R,-R,R,R);
  grd.addColorStop(0,'#f4ffe0'); grd.addColorStop(.45,'#c6ff4a'); grd.addColorStop(1,'#6fae1c');
  g.fillStyle=grd;
  g.beginPath(); g.roundRect(-R*0.55,-R*0.8,R*1.1,R*1.6,R*0.3); g.fill();
  g.strokeStyle='rgba(25,45,10,.65)'; g.lineWidth=S*0.014; g.stroke();
  g.fillStyle='rgba(20,40,8,.6)'; g.fillRect(-R*0.55,-R*0.18,R*1.1,R*0.12);
  g.fillStyle='rgba(255,255,255,.75)';
  g.beginPath(); g.roundRect(-R*0.36,-R*0.66,R*0.22,R*0.9,R*0.11); g.fill();
  return c;
}
/* --- planets --- */
function makePlanet(kind,S){
  const c=oc(S,S), g=c.getContext('2d'); g.translate(S/2,S/2);
  const R=S*(kind==='saturn'?0.26:0.34);
  const P={
    moon:   {base:'#c9c9c4', dark:'#5d5d5c', light:'#f2f0e8'},
    mars:   {base:'#c8562c', dark:'#5d1f10', light:'#ffb079'},
    jupiter:{base:'#d9b48b', dark:'#6d4526', light:'#f5e2c4'},
    saturn: {base:'#e0c48c', dark:'#7a5c2c', light:'#f8ecc9'},
    neptune:{base:'#2f6fd0', dark:'#10245e', light:'#7fb4f5'},
    pluto:  {base:'#b9a390', dark:'#5a4638', light:'#eadfd1'}
  }[kind];
  // atmosphere glow
  const at=g.createRadialGradient(0,0,R*0.92,0,0,R*1.42);
  at.addColorStop(0,'rgba(255,255,255,.20)');
  at.addColorStop(.35,(kind==='neptune'?'rgba(90,150,255,.22)':'rgba(255,220,170,.14)'));
  at.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=at; g.beginPath(); g.arc(0,0,R*1.42,0,6.283); g.fill();
  // saturn's back ring
  if(kind==='saturn'){
    g.save(); g.rotate(-0.36);
    for(let i=0;i<4;i++){
      g.beginPath();
      g.ellipse(0,0,R*(1.75+i*0.16),R*(0.40+i*0.037),0,Math.PI,Math.PI*2);
      g.strokeStyle=['rgba(240,222,180,.75)','rgba(200,178,132,.5)','rgba(245,232,200,.6)','rgba(170,150,110,.38)'][i];
      g.lineWidth=R*(0.09-i*0.012); g.stroke();
    }
    g.restore();
  }
  // sphere
  g.save();
  g.beginPath(); g.arc(0,0,R,0,6.283); g.clip();
  const body=g.createRadialGradient(-R*0.38,-R*0.42,R*0.06,0,0,R*1.15);
  body.addColorStop(0,P.light); body.addColorStop(.5,P.base); body.addColorStop(1,P.dark);
  g.fillStyle=body; g.fillRect(-R,-R,R*2,R*2);
  if(kind==='moon'||kind==='pluto'){
    let s=99;
    const rr=()=>{ s=(s*16807)%2147483647; return s/2147483647; };
    for(let i=0;i<24;i++){
      const cx=(rr()-.5)*R*1.9, cy=(rr()-.5)*R*1.9, cr=R*(0.03+rr()*0.13);
      if(Math.hypot(cx,cy)>R*0.97) continue;
      g.beginPath(); g.arc(cx,cy,cr,0,6.283);
      g.fillStyle='rgba(0,0,0,'+(0.10+rr()*0.16).toFixed(2)+')'; g.fill();
      g.beginPath(); g.arc(cx-cr*0.2,cy-cr*0.22,cr*0.75,0,6.283);
      g.fillStyle='rgba(255,255,255,.09)'; g.fill();
    }
    if(kind==='pluto'){   // the famous heart
      g.fillStyle='rgba(255,248,235,.55)';
      g.beginPath(); g.ellipse(R*0.1,R*0.18,R*0.34,R*0.30,0.3,0,6.283); g.fill();
      g.beginPath(); g.ellipse(-R*0.22,R*0.1,R*0.22,R*0.26,-0.3,0,6.283); g.fill();
    }
  } else if(kind==='mars'){
    g.fillStyle='rgba(80,25,10,.35)';
    for(let i=0;i<7;i++){ g.beginPath();
      g.ellipse((i%3-1)*R*0.5,(i*0.31-1)*R*0.7,R*(0.3+i*0.05),R*0.14,i*0.5,0,6.283); g.fill(); }
    g.fillStyle='rgba(255,255,255,.82)';   // polar caps
    g.beginPath(); g.ellipse(0,-R*0.92,R*0.42,R*0.17,0,0,6.283); g.fill();
    g.beginPath(); g.ellipse(0,R*0.95,R*0.34,R*0.13,0,0,6.283); g.fill();
  } else {  // gas giants: bands
    const bands = kind==='jupiter'
      ? ['rgba(120,74,40,.45)','rgba(245,226,196,.55)','rgba(160,104,58,.42)','rgba(250,236,210,.4)','rgba(110,68,38,.4)']
      : kind==='saturn' ? ['rgba(150,112,54,.36)','rgba(250,238,205,.45)','rgba(170,132,70,.32)','rgba(245,230,195,.36)']
      : ['rgba(15,40,110,.5)','rgba(120,175,255,.35)','rgba(20,55,140,.45)','rgba(150,200,255,.28)'];
    for(let i=0;i<14;i++){
      const y=-R+ (i/14)*R*2, h=R*2/14*rnd(0.7,1.5);
      g.fillStyle=bands[i%bands.length];
      g.beginPath(); g.ellipse(0,y,R*1.05,h*0.55,0,0,6.283); g.fill();
    }
    if(kind==='jupiter'){                  // great red spot
      g.beginPath(); g.ellipse(R*0.28,R*0.2,R*0.28,R*0.16,0.15,0,6.283);
      g.fillStyle='rgba(196,86,48,.85)'; g.fill();
      g.strokeStyle='rgba(255,200,170,.45)'; g.lineWidth=R*0.02; g.stroke();
    }
    if(kind==='neptune'){
      g.beginPath(); g.ellipse(-R*0.2,-R*0.16,R*0.22,R*0.12,0.2,0,6.283);
      g.fillStyle='rgba(10,20,60,.7)'; g.fill();
    }
  }
  // terminator shading
  const term=g.createLinearGradient(-R*0.3,-R*0.5,R*1.05,R*0.9);
  term.addColorStop(0,'rgba(0,0,0,0)'); term.addColorStop(.55,'rgba(0,0,0,.28)');
  term.addColorStop(1,'rgba(0,0,0,.82)');
  g.fillStyle=term; g.fillRect(-R,-R,R*2,R*2);
  g.restore();
  // saturn's front ring
  if(kind==='saturn'){
    g.save(); g.rotate(-0.36);
    for(let i=0;i<4;i++){
      g.beginPath();
      g.ellipse(0,0,R*(1.75+i*0.16),R*(0.40+i*0.037),0,0,Math.PI);
      g.strokeStyle=['rgba(240,222,180,.85)','rgba(200,178,132,.6)','rgba(245,232,200,.7)','rgba(170,150,110,.45)'][i];
      g.lineWidth=R*(0.09-i*0.012); g.stroke();
    }
    g.restore();
  }
  return c;
}
/* --- nebula backdrop --- */
function makeNebula(cols,S){
  const c=oc(S,S), g=c.getContext('2d');
  g.fillStyle='#04060f'; g.fillRect(0,0,S,S);
  for(let i=0;i<26;i++){
    const x=rnd(0,S), y=rnd(0,S), r=rnd(S*0.08,S*0.34);
    const col=cols[ri(cols.length)];
    const grd=g.createRadialGradient(x,y,0,x,y,r);
    grd.addColorStop(0,col.replace('ALPHA','0.24'));
    grd.addColorStop(.5,col.replace('ALPHA','0.09'));
    grd.addColorStop(1,col.replace('ALPHA','0'));
    g.fillStyle=grd; g.beginPath(); g.arc(x,y,r,0,6.283); g.fill();
  }
  for(let i=0;i<400;i++){         // faint distant star dust
    g.fillStyle='rgba(255,255,255,'+rnd(0.03,0.16).toFixed(3)+')';
    g.fillRect(rnd(0,S),rnd(0,S),1,1);
  }
  return c;
}

/* ================= art cache ================= */
const ART={rocks:[],ice:[],metal:[],comet:null,fuel:null,planets:{},neb:{}};
function buildArt(){
  if(ART.built) return; ART.built=true;
  ART.rocks=[
    makeRock(160,'#8a7f74','#2e2823','#d8cec2',12345),
    makeRock(160,'#7d6a5c','#241c16','#cbb6a3',54321),
    makeRock(160,'#6f6f78','#22222b','#c2c2cf',24680),
    makeRock(160,'#94664a','#2d180f','#e2ab86',13579)
  ];
  ART.ice=[makeIce(150,777), makeIce(150,313)];
  ART.metal=[makeMetal(170,1), makeMetal(170,2)];
  ART.comet=makeComet(190);
  ART.fuel=makeFuel(150);
}
function planetArt(kind){ if(!ART.planets[kind]) ART.planets[kind]=makePlanet(kind,420); return ART.planets[kind]; }
function nebArt(key,cols){ if(!ART.neb[key]) ART.neb[key]=makeNebula(cols,512); return ART.neb[key]; }

/* ================= levels ================= */
const LEVELS=[
  {name:'The Moon', planet:'moon', dist:34000, mix:{rock:.86,ice:.06,metal:.08,comet:0},
   waveGap:1350, per:[7,10], gap:186, drift:150, spin:.5,
   cols:['rgba(120,140,200,ALPHA)','rgba(80,90,140,ALPHA)'],
   line:'Your first hop. A thin scatter of moon rock — get used to the controls.'},
  {name:'Mars', planet:'mars', dist:42000, mix:{rock:.72,ice:.05,metal:.20,comet:.03},
   waveGap:1230, per:[9,13], gap:172, drift:190, spin:.7,
   cols:['rgba(220,110,60,ALPHA)','rgba(150,50,30,ALPHA)','rgba(90,60,140,ALPHA)'],
   line:'Red dust and old landers tumbling in orbit. Watch for satellite wreckage.'},
  {name:'Jupiter', planet:'jupiter', dist:50000, mix:{rock:.80,ice:.04,metal:.10,comet:.06},
   waveGap:1120, per:[11,15], gap:162, drift:225, spin:.95,
   cols:['rgba(230,170,110,ALPHA)','rgba(160,90,50,ALPHA)','rgba(70,90,170,ALPHA)'],
   line:'The asteroid belt. Big, heavy rocks — and they are moving fast.'},
  {name:'Saturn', planet:'saturn', dist:56000, mix:{rock:.34,ice:.54,metal:.06,comet:.06},
   waveGap:1030, per:[13,18], gap:154, drift:250, spin:1.1,
   cols:['rgba(240,220,160,ALPHA)','rgba(180,150,90,ALPHA)','rgba(90,120,190,ALPHA)'],
   line:'Straight through the rings: a blizzard of ice. Dense, but the shards are small.'},
  {name:'Neptune', planet:'neptune', dist:62000, mix:{rock:.44,ice:.20,metal:.24,comet:.12},
   waveGap:960,  per:[14,19], gap:148, drift:275, spin:1.25,
   cols:['rgba(60,110,230,ALPHA)','rgba(20,40,120,ALPHA)','rgba(120,60,190,ALPHA)'],
   line:'Dark and cold. Frozen wreckage everywhere, and comets come out of nowhere.'},
  {name:'Pluto', planet:'pluto', dist:70000, mix:{rock:.40,ice:.26,metal:.16,comet:.18},
   waveGap:900,  per:[16,22], gap:142, drift:300, spin:1.4,
   cols:['rgba(180,150,130,ALPHA)','rgba(70,55,90,ALPHA)','rgba(40,60,140,ALPHA)'],
   line:'The edge of everything. Nothing out here is friendly. Good luck, pilot.'}
];
const DIFFS=[
  {name:'Cadet',      maxSpd:1380, minSpd:320, acc:3250, dampf:.90, gapMul:1.28, denMul:.70, driftMul:.75,
   rivalSpd:870,  fuelUse:.85, fuelDrop:.70, mult:1.0},
  {name:'Pilot',      maxSpd:1680, minSpd:370, acc:3050, dampf:.902,gapMul:1.00, denMul:1.0, driftMul:1.0,
   rivalSpd:1140, fuelUse:1.0,  fuelDrop:.52, mult:1.7},
  {name:'Daddy mode', maxSpd:2020, minSpd:420, acc:2900, dampf:.905,gapMul:.84, denMul:1.28, driftMul:1.25,
   rivalSpd:1490, fuelUse:1.18, fuelDrop:.40, mult:2.7}
];
const MAX_HITS=10;
const PLAY=560, SHIP_R=46, FAR=2900, HITZ=55, F=760;

/* ================= state ================= */
let D=DIFFS[0], L=LEVELS[0], level=0;
let ship={x:0,y:0,vx:0,vy:0}, thr=0, obs=[], cells=[], stars=[];
let travelled=0, spd=0, hits=0, fuel=100, score=0, raceT=0;
let rivalPos=0, over=false, outcome=null, started=false;
let shake=0, flash=0, pickFlash=0, nextWave=0, campaign=0, sparks=[];
let corr={x:0,y:0};
let stats={dodged:0,fuelGot:0,best:0,hits:0};
let input={x:0,y:0};

function makeStars(){
  stars=[];
  for(let i=0;i<210;i++) stars.push({x:rnd(-2600,2600), y:rnd(-2600,2600), z:rnd(60,FAR), b:rnd(.35,1)});
}
function newGame(lv,diffIdx){
  if(diffIdx!==undefined) D=DIFFS[diffIdx];
  level=lv; L=LEVELS[lv];
  ship={x:0,y:0,vx:0,vy:0}; thr=0; obs=[]; cells=[]; sparks=[];
  travelled=0; spd=D.minSpd; hits=0; fuel=100; score=0; raceT=0;
  rivalPos=0; over=false; outcome=null; started=false;
  shake=0; flash=0; pickFlash=0; nextWave=900; corr={x:0,y:0};
  stats={dodged:0,fuelGot:0,best:0,hits:0};
  input.x=0; input.y=0;
  makeStars();
}
function pickType(){
  const m=L.mix, r=rng();
  let a=m.rock; if(r<a) return 'rock';
  a+=m.ice;   if(r<a) return 'ice';
  a+=m.metal; if(r<a) return 'metal';
  return 'comet';
}
/* Each wave is generated with a guaranteed hole, so every level is always
   flyable — the challenge is reaching the gap in time, not luck. */
/* The safe gap is a TUNNEL, not a lottery: it drifts by a limited amount each wave so
   it is always reachable from where you are. That is what lets the field be packed
   this densely and still be fair. */
function spawnWave(){
  const dr=L.drift*D.driftMul;
  corr.x=clamp(corr.x+rnd(-dr,dr), -PLAY*0.80, PLAY*0.80);
  corr.y=clamp(corr.y+rnd(-dr,dr), -PLAY*0.80, PLAY*0.80);
  const cx=corr.x, cy=corr.y;
  const gap=L.gap*D.gapMul;
  const n=Math.round(rnd(L.per[0],L.per[1])*D.denMul);
  let placed=0, guard=0;
  while(placed<n && guard++<400){
    const t=pickType();
    const r = t==='ice' ? rnd(40,66) : t==='comet' ? rnd(44,60) : t==='metal' ? rnd(54,86) : rnd(48,96);
    let x,y;
    if(rng()<0.58){                       // ring the mouth of the tunnel so the gap reads clearly
      const a=rnd(0,6.283), rad=gap+r+rnd(0,150);
      x=cx+Math.cos(a)*rad; y=cy+Math.sin(a)*rad;
    } else {                              // and scatter the rest across the field
      x=rnd(-PLAY-110,PLAY+110); y=rnd(-PLAY-110,PLAY+110);
    }
    if(Math.abs(x)>PLAY+130||Math.abs(y)>PLAY+130) continue;
    if(Math.hypot(x-cx,y-cy) < gap+r) continue;          // never seal the tunnel
    obs.push({x,y,z:FAR,pz:FAR,r,t,rot:rnd(0,6.28),spin:rnd(-1,1)*L.spin,
      art: t==='rock'?ART.rocks[ri(ART.rocks.length)] : t==='ice'?ART.ice[ri(ART.ice.length)]
         : t==='metal'?ART.metal[ri(ART.metal.length)] : ART.comet,
      vx: t==='comet'?rnd(-70,70):0, vy: t==='comet'?rnd(-70,70):0, hit:false});
    placed++;
  }
  if(rng()<D.fuelDrop) cells.push({x:cx,y:cy,z:FAR,pz:FAR,r:44,got:false,ph:rnd(0,6.28)});
}
function addSparks(x,y,col,n){
  for(let i=0;i<n;i++) sparks.push({x,y,vx:rnd(-260,260),vy:rnd(-260,260),a:1,col,s:rnd(2,5)});
}
function hitObstacle(o){
  o.hit=true; hits++; stats.hits=hits;
  const pen = o.t==='metal'?0.62 : o.t==='rock'?0.55 : o.t==='comet'?0.7 : 0.78;
  spd*=pen; shake=1; flash=1;
  addSparks(o.x-ship.x,o.y-ship.y, o.t==='ice'?'#bfe9ff':(o.t==='metal'?'#ffd9a0':'#ff9a5a'), 22);
  bigMsg(o.t==='ice'?'CRUNCH!':(o.t==='metal'?'CLANG!':'CRASH!'),'#ff5c7a');
  if(hits>=MAX_HITS){ over=true; outcome='wrecked'; }
}
function stepWorld(dt){
  if(over||!started) return;
  updateNav();
  raceT+=dt;
  // ---- engine ----
  const want=D.minSpd + thr*(D.maxSpd-D.minSpd) * (fuel<=0?0.34:1);
  spd += (want-spd)*clamp(dt*1.9,0,1);
  travelled += spd*dt;
  fuel = clamp(fuel - (0.42+thr*1.25)*D.fuelUse*dt, 0, 100);
  rivalPos += D.rivalSpd*dt;
  // ---- steering ----
  ship.vx += input.x*D.acc*dt; ship.vy += input.y*D.acc*1.45*dt;   // climbing/diving is snappier
  const damp=Math.pow(D.dampf,dt*60);
  ship.vx*=damp; ship.vy*=damp;
  ship.x=clamp(ship.x+ship.vx*dt,-PLAY,PLAY);
  ship.y=clamp(ship.y+ship.vy*dt,-PLAY,PLAY);
  if(ship.x<=-PLAY||ship.x>=PLAY) ship.vx*=-0.3;
  if(ship.y<=-PLAY||ship.y>=PLAY) ship.vy*=-0.3;
  // ---- waves ----
  nextWave-=spd*dt;
  if(nextWave<=0){ nextWave=L.waveGap; spawnWave(); }
  // ---- obstacles ----
  for(let i=obs.length-1;i>=0;i--){
    const o=obs[i];
    o.pz=o.z; o.z-=spd*dt; o.rot+=o.spin*dt;
    o.x+=o.vx*dt; o.y+=o.vy*dt;
    if(!o.hit && o.pz>HITZ && o.z<=HITZ){
      if(Math.hypot(o.x-ship.x,o.y-ship.y) < o.r+SHIP_R) hitObstacle(o);
      else { stats.dodged++; score+=Math.round(6*(1+thr)); }
    }
    if(o.z<-140) obs.splice(i,1);
  }
  // ---- fuel cells ----
  for(let i=cells.length-1;i>=0;i--){
    const c=cells[i];
    c.pz=c.z; c.z-=spd*dt; c.ph+=dt*3;
    if(!c.got && c.pz>HITZ && c.z<=HITZ){
      if(Math.hypot(c.x-ship.x,c.y-ship.y) < c.r+SHIP_R){
        c.got=true; fuel=clamp(fuel+26,0,100); stats.fuelGot++; score+=60; pickFlash=1;
        addSparks(c.x-ship.x,c.y-ship.y,'#c6ff4a',16);
        bigMsg('+FUEL','#c6ff4a');
      }
    }
    if(c.z<-140) cells.splice(i,1);
  }
  // ---- stars recycle ----
  for(const s of stars){ s.z-=spd*dt; if(s.z<40){ s.z=FAR; s.x=rnd(-2600,2600); s.y=rnd(-2600,2600); } }
  // ---- fx ----
  for(const p of sparks){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.a-=dt*1.6; }
  sparks=sparks.filter(p=>p.a>0.02);
  if(shake>0) shake=Math.max(0,shake-dt*2.6);
  if(flash>0) flash=Math.max(0,flash-dt*2.2);
  if(pickFlash>0) pickFlash=Math.max(0,pickFlash-dt*2.2);
  if(spd>stats.best) stats.best=spd;
  // ---- arrival ----
  if(travelled>=L.dist){ over=true; outcome='arrived'; }
}
function progress(){ return clamp(travelled/L.dist,0,1); }
function rivalProgress(){ return clamp(rivalPos/L.dist,0,1); }
function score_(){
  if(outcome!=='arrived') return 0;
  const base=1200;
  const timeB=Math.max(0,Math.round((160-raceT)*9));
  const hullB=(MAX_HITS-hits)*80;
  const beat = rivalProgress()<1 ? 400 : 0;
  return Math.max(0,Math.round((base+timeB+hullB+beat+score)*D.mult));
}

/* ================= view ================= */
const view=$('view'), vx=view.getContext('2d');
let VW=0,VH=0,DPR=1;
function fitCanvas(){
  const st=view.parentElement, W=st.clientWidth, H=st.clientHeight;
  if(!W||!H) return;
  DPR=Math.min(window.devicePixelRatio||1,2.5);
  view.style.width=W+'px'; view.style.height=H+'px';
  view.width=Math.round(W*DPR); view.height=Math.round(H*DPR);
  vx.setTransform(DPR,0,0,DPR,0,0);
  VW=W; VH=H;
}
window.addEventListener('resize',()=>{ fitCanvas(); if(parts.length||confRaf) sizeCv(); });

function draw(){
  const W=VW,H=VH; if(!W||!H) return;
  const cx=W/2, cy=H/2;
  const f=F*(H/560);
  vx.clearRect(0,0,W,H);
  vx.save();
  // screen shake
  if(shake>0){ vx.translate(rnd(-1,1)*shake*11, rnd(-1,1)*shake*11); }
  // roll with lateral velocity — the whole world banks, the canopy does not
  const roll=clamp(-ship.vx/900,-0.26,0.26);
  vx.save(); vx.translate(cx,cy); vx.rotate(roll); vx.translate(-cx,-cy);

  // ---------- nebula ----------
  const neb=nebArt(L.planet,L.cols);
  const nx=cx - ship.x*0.045, ny=cy - ship.y*0.045;
  const nsize=Math.max(W,H)*1.7;
  vx.globalAlpha=1;
  vx.drawImage(neb, nx-nsize/2, ny-nsize/2, nsize, nsize);

  // ---------- stars ----------
  for(const s of stars){
    const z=s.z; if(z<40) continue;
    const px=cx+(s.x-ship.x*0.5)*f/z, py=cy+(s.y-ship.y*0.5)*f/z;
    if(px<-30||px>W+30||py<-30||py>H+30) continue;
    const k=clamp(1-z/FAR,0,1), sz=0.6+k*2.1;
    vx.globalAlpha=clamp(s.b*(0.25+k*0.9),0,1);
    vx.fillStyle='#ffffff';
    // fast travel stretches the stars into streaks
    const streak=clamp((spd/D.maxSpd)*k*26,0,26);
    if(streak>2){ const z2=z+streak*9;
      const px2=cx+(s.x-ship.x*0.5)*f/z2, py2=cy+(s.y-ship.y*0.5)*f/z2;
      vx.lineWidth=sz; vx.strokeStyle='rgba(255,255,255,'+(0.5*s.b).toFixed(2)+')';
      vx.beginPath(); vx.moveTo(px,py); vx.lineTo(px2,py2); vx.stroke();
    } else vx.fillRect(px-sz/2,py-sz/2,sz,sz);
  }
  vx.globalAlpha=1;

  // ---------- destination planet ----------
  const rem=Math.max(600,(1-progress())*L.dist+900);
  const pz=rem*0.55+700;
  const psz=(L.planet==='saturn'?2.9:2.2)*f*260/pz;
  const ppx=cx+(-ship.x*0.16)*f/pz*1.0, ppy=cy+(-ship.y*0.16)*f/pz*1.0 - H*0.05;
  const pa=planetArt(L.planet);
  vx.drawImage(pa, ppx-psz/2, ppy-psz/2, psz, psz);

  // ---------- rival ship (a distant engine flare) ----------
  const rp=rivalProgress(), mp=progress();
  if(rp>mp){
    const lead=(rp-mp)*L.dist;
    const rz=clamp(lead*0.9+240,240,FAR);
    const rx=cx+(Math.sin(raceT*0.7)*130-ship.x)*f/rz, ry=cy+(Math.cos(raceT*0.5)*90-ship.y)*f/rz;
    const rs=clamp(f*40/rz,2,30);
    const gg=vx.createRadialGradient(rx,ry,0,rx,ry,rs*2.4);
    gg.addColorStop(0,'rgba(255,220,180,.95)'); gg.addColorStop(.4,'rgba(255,120,60,.6)');
    gg.addColorStop(1,'rgba(255,80,40,0)');
    vx.fillStyle=gg; vx.beginPath(); vx.arc(rx,ry,rs*2.4,0,6.283); vx.fill();
  }

  // ---------- obstacles (far to near) ----------
  for(let i=obs.length-1;i>=0;i--){
    const o=obs[i]; if(o.z<8) continue;
    const px=cx+(o.x-ship.x)*f/o.z, py=cy+(o.y-ship.y)*f/o.z;
    const sz=o.r*2*f/o.z;
    if(px+sz<-40||px-sz>W+40||py+sz<-40||py-sz>H+40) continue;
    const near=clamp(1-o.z/FAR,0,1);
    vx.save(); vx.translate(px,py); vx.rotate(o.rot);
    vx.globalAlpha=clamp(0.15+near*1.5,0,1);
    if(o.t==='comet'){
      // tail points back toward where it came from
      const tl=sz*2.1;
      const tg=vx.createLinearGradient(0,0,0,tl);
      tg.addColorStop(0,'rgba(180,235,255,.75)'); tg.addColorStop(1,'rgba(120,180,255,0)');
      vx.fillStyle=tg;
      vx.beginPath(); vx.moveTo(-sz*0.34,0); vx.lineTo(sz*0.34,0); vx.lineTo(0,tl); vx.closePath(); vx.fill();
    }
    vx.drawImage(o.art,-sz/2,-sz/2,sz,sz);
    vx.restore();
  }
  vx.globalAlpha=1;

  // ---------- fuel cells ----------
  for(const c of cells){
    if(c.z<8||c.got) continue;
    const px=cx+(c.x-ship.x)*f/c.z, py=cy+(c.y-ship.y)*f/c.z;
    const sz=c.r*2*f/c.z*(1+Math.sin(c.ph)*0.09);
    if(px+sz<-40||px-sz>W+40) continue;
    vx.save(); vx.translate(px,py);
    vx.globalAlpha=clamp(0.2+(1-c.z/FAR)*1.4,0,1);
    vx.drawImage(ART.fuel,-sz/2,-sz/2,sz,sz);
    vx.restore();
  }
  vx.globalAlpha=1;

  // ---------- sparks ----------
  for(const p of sparks){
    const px=cx+p.x*f/HITZ*0.06, py=cy+p.y*f/HITZ*0.06;
    vx.globalAlpha=clamp(p.a,0,1); vx.fillStyle=p.col;
    vx.fillRect(px-p.s/2,py-p.s/2,p.s,p.s);
  }
  vx.globalAlpha=1;
  vx.restore();   // end roll

  // ================= COCKPIT =================
  drawCockpit(W,H,cx,cy);
  vx.restore(); // end shake
}
function drawCockpit(W,H,cx,cy){
  const r=Math.min(W,H);
  // --- canopy: dark frame with a rounded window cut out ---
  const inset=r*0.045, rad=r*0.20;
  vx.save();
  vx.beginPath();
  vx.rect(0,0,W,H);
  vx.moveTo(inset+rad,inset);
  vx.arcTo(W-inset,inset,W-inset,H-inset,rad);
  vx.arcTo(W-inset,H-inset,inset,H-inset,rad);
  vx.arcTo(inset,H-inset,inset,inset,rad);
  vx.arcTo(inset,inset,W-inset,inset,rad);
  vx.closePath();
  const fg=vx.createLinearGradient(0,0,0,H);
  fg.addColorStop(0,'#26314f'); fg.addColorStop(.42,'#141c33'); fg.addColorStop(1,'#0b1123');
  vx.fillStyle=fg; vx.fill('evenodd');
  vx.restore();
  // frame highlight
  vx.save();
  vx.beginPath();
  vx.moveTo(inset+rad,inset);
  vx.arcTo(W-inset,inset,W-inset,H-inset,rad);
  vx.arcTo(W-inset,H-inset,inset,H-inset,rad);
  vx.arcTo(inset,H-inset,inset,inset,rad);
  vx.arcTo(inset,inset,W-inset,inset,rad);
  vx.closePath();
  vx.strokeStyle='rgba(160,200,255,.30)'; vx.lineWidth=r*0.012; vx.stroke();
  vx.strokeStyle='rgba(255,255,255,.10)'; vx.lineWidth=r*0.004; vx.stroke();
  vx.restore();
  // --- canopy struts ---
  vx.save();
  vx.fillStyle='rgba(18,25,45,.92)';
  vx.fillRect(cx-r*0.012, 0, r*0.024, inset+r*0.055);          // top centre strut
  vx.fillRect(cx-r*0.012, H-inset-r*0.055, r*0.024, r*0.06);   // bottom centre strut
  vx.fillStyle='rgba(160,200,255,.18)';
  vx.fillRect(cx-r*0.012, 0, r*0.005, inset+r*0.055);
  vx.restore();
  // --- glass sheen ---
  vx.save();
  vx.beginPath();
  vx.moveTo(inset+rad,inset);
  vx.arcTo(W-inset,inset,W-inset,H-inset,rad);
  vx.arcTo(W-inset,H-inset,inset,H-inset,rad);
  vx.arcTo(inset,H-inset,inset,inset,rad);
  vx.arcTo(inset,inset,W-inset,inset,rad);
  vx.closePath(); vx.clip();
  const sg=vx.createLinearGradient(0,0,W*0.85,H);
  sg.addColorStop(0,'rgba(200,230,255,.10)'); sg.addColorStop(.28,'rgba(200,230,255,.02)');
  sg.addColorStop(.6,'rgba(255,255,255,0)');
  vx.fillStyle=sg; vx.fillRect(0,0,W,H);
  // vignette
  const vg=vx.createRadialGradient(cx,cy,r*0.28,cx,cy,r*0.78);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.5)');
  vx.fillStyle=vg; vx.fillRect(0,0,W,H);
  // damage / pickup flashes
  if(flash>0){ vx.fillStyle='rgba(255,60,80,'+(flash*0.34).toFixed(3)+')'; vx.fillRect(0,0,W,H); }
  if(pickFlash>0){ vx.fillStyle='rgba(180,255,90,'+(pickFlash*0.18).toFixed(3)+')'; vx.fillRect(0,0,W,H); }
  vx.restore();
  // --- HUD reticle (drifts with your velocity) ---
  const hx=cx+clamp(ship.vx*0.05,-r*0.13,r*0.13), hy=cy+clamp(ship.vy*0.05,-r*0.13,r*0.13);
  vx.save();
  vx.strokeStyle='rgba(92,225,230,.75)'; vx.lineWidth=r*0.0065;
  vx.beginPath(); vx.arc(hx,hy,r*0.062,0,6.283); vx.stroke();
  vx.beginPath(); vx.arc(hx,hy,r*0.008,0,6.283); vx.fillStyle='rgba(92,225,230,.85)'; vx.fill();
  vx.beginPath();
  vx.moveTo(hx-r*0.098,hy); vx.lineTo(hx-r*0.072,hy);
  vx.moveTo(hx+r*0.072,hy); vx.lineTo(hx+r*0.098,hy);
  vx.moveTo(hx,hy-r*0.098); vx.lineTo(hx,hy-r*0.072);
  vx.moveTo(hx,hy+r*0.072); vx.lineTo(hx,hy+r*0.098);
  vx.stroke();
  vx.restore();
  // --- corner instrument glow ---
  vx.save();
  const eg=vx.createLinearGradient(0,H-inset*2.4,0,H);
  eg.addColorStop(0,'rgba(255,140,60,0)'); eg.addColorStop(1,'rgba(255,140,60,'+(0.10+thr*0.30).toFixed(3)+')');
  vx.fillStyle=eg; vx.fillRect(0,H-inset*2.4,W,inset*2.4);
  vx.restore();
  // --- warning strip when the hull is nearly gone ---
  if(hits>=MAX_HITS-3 && !over){
    const p=0.5+0.5*Math.sin(performance.now()/140);
    vx.save(); vx.strokeStyle='rgba(255,70,90,'+(0.35+p*0.45).toFixed(2)+')';
    vx.lineWidth=r*0.02;
    vx.strokeRect(inset*0.55,inset*0.55,W-inset*1.1,H-inset*1.1);
    vx.restore();
  }
}

/* ================= hud ================= */
function bigMsg(t,c){ const el=$('bigmsg'); el.textContent=t; el.style.color=c||'#f4ead6';
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show'); }
function hud(){
  $('hSpd').textContent=Math.round(spd/10);
  $('hDist').textContent=Math.max(0,Math.round((L.dist-travelled)/1000))+'k';
  $('hFuel').textContent=Math.round(fuel);
  $('hScore').textContent=score;
  $('shields').innerHTML=Array.from({length:MAX_HITS},(_,i)=>
    '<span class="sh'+(i<hits?' gone':'')+'">'+(i<hits?'💥':'🛡️')+'</span>').join('');
  const p=progress()*100, rp=rivalProgress()*100;
  $('tbFill').style.width=p+'%';
  $('tbMe').style.left=p+'%';
  $('tbRiv').style.left=Math.min(100,rp)+'%';
  const tp=Math.round(thr*100);
  $('thrFill').style.width=tp+'%';
  $('thrKnob').style.left=tp+'%';
  $('thrVal').textContent=tp+'%';
}

/* ================= loop ================= */
let raf=null,lastT=0,countdown=0;
function loop(t){
  if(!at('game')){ raf=null; return; }
  const dt=Math.min(.04,(t-lastT)/1000||0); lastT=t;
  if(countdown>0){ countdown-=dt; if(countdown<=0){ started=true; bigMsg('GO!','#c6ff4a'); } }
  if(started&&!over) stepWorld(dt);
  draw(); hud();
  if(over && !overHandled){ overHandled=true; setTimeout(showResult,800); }
  raf=requestAnimationFrame(loop);
}
let overHandled=false;
function startLevel(lv,diffIdx){
  buildArt(); stopConfetti(); newGame(lv,diffIdx);
  const l=LEVELS[lv];
  $('briefStep').textContent='Mission '+(lv+1)+' of '+LEVELS.length;
  $('briefName').textContent=l.name;
  $('briefLine').textContent=l.line;
  $('briefChips').innerHTML=
    '<span class="chip">🛰️ '+Math.round(l.dist/1000)+'k km</span>'+
    '<span class="chip">🛡️ '+MAX_HITS+' shields</span>'+
    '<span class="chip">👾 rival ship</span>';
  const bg=$('briefCv').getContext('2d');
  bg.clearRect(0,0,336,336);
  bg.drawImage(planetArt(l.planet),0,0,336,336);
  show('brief');
}
function launch(){
  show('game'); fitCanvas();
  countdown=2.6; started=false; over=false; overHandled=false; lastT=performance.now();
  thr=0.55; bigMsg('3','#ffd24a');
  setTimeout(()=>{ if(at('game')) bigMsg('2','#ffd24a'); },800);
  setTimeout(()=>{ if(at('game')) bigMsg('1','#ffd24a'); },1600);
  if(raf) cancelAnimationFrame(raf);
  raf=requestAnimationFrame(loop);
}
function showResult(){
  const sc=score_(), beat=rivalProgress()<1;
  const arrived=outcome==='arrived';
  const stars_ = !arrived ? 0 : (hits<=1&&beat ? 3 : (hits<=4&&beat ? 2 : (beat?2:1)));
  $('resEmoji').textContent = arrived ? (beat?'🏆':'🎖️') : '💥';
  $('resTitle').textContent = arrived
    ? (beat ? 'You beat them to '+L.name+'!' : 'Landed on '+L.name)
    : 'Rocket wrecked!';
  $('resSub').textContent = arrived
    ? (beat ? 'First ship to arrive. Outstanding flying!' : 'The rival ship got there first — fly faster next time.')
    : 'Ten hits and the hull gave out. Watch the gaps!';
  $('resStars').textContent = arrived ? '★★★'.slice(0,stars_).padEnd(3,'☆') : '';
  campaign += sc;
  $('stats').innerHTML=
    '<div class="srow"><span class="k">🪐 Planet</span><span class="v">'+L.name+'</span></div>'+
    '<div class="srow"><span class="k">⏱️ Flight time</span><span class="v">'+raceT.toFixed(1)+'s</span></div>'+
    '<div class="srow"><span class="k">💥 Hits taken</span><span class="v">'+hits+' / '+MAX_HITS+'</span></div>'+
    '<div class="srow"><span class="k">🪨 Rocks dodged</span><span class="v">'+stats.dodged+'</span></div>'+
    '<div class="srow"><span class="k">⛽ Fuel cells</span><span class="v">'+stats.fuelGot+'</span></div>'+
    '<div class="srow"><span class="k">🚀 Top speed</span><span class="v">'+Math.round(stats.best/10)+'</span></div>'+
    '<div class="srow tot"><span class="k">🏅 Score</span><span class="v">'+sc+'</span></div>';
  const last=level>=LEVELS.length-1;
  $('nextBtn').style.display = (arrived && !last) ? 'block' : 'none';
  if(arrived && last) saveBest(campaign);
  if(arrived && beat) burst(2500);
  $('resBest').textContent=bestText();
  show('result');
}
function saveBest(v){ try{ let b=JSON.parse(localStorage.getItem('alexrocket_top3')||'[]');
  if(!Array.isArray(b)) b=[]; b.push(v); b.sort((x,y)=>y-x); b=b.slice(0,3);
  localStorage.setItem('alexrocket_top3',JSON.stringify(b)); }catch(e){} }
function bestText(){ try{ const b=JSON.parse(localStorage.getItem('alexrocket_top3')||'[]');
  if(!Array.isArray(b)||!b.length) return '';
  return '🥇🥈🥉'.slice(0,b.length*2).match(/../g).map((m,i)=>m+' '+b[i]).join('   '); }catch(e){ return ''; } }

/* ================= input ================= */
/* ---- fly with your finger ----
   Put a finger anywhere on the window and the rocket flies to it — up, down, left,
   right and every direction between. Drag the finger and the rocket follows. */
const held={u:false,d:false,l:false,r:false};
function applyDir(){ input.x=(held.l?-1:0)+(held.r?1:0); input.y=(held.u?-1:0)+(held.d?1:0); }
let touchNav=false, navX=0, navY=0;
// Vertical needs more gain than horizontal: a thumb sweeps side to side easily but
// can only travel a short way up and down, so the top and bottom of the field must
// be reachable without stretching to the very edge of the glass.
const NAV_GAIN_X=1.12, NAV_GAIN_Y=1.85;
function navAt(cx,cy){
  const r=view.getBoundingClientRect();
  if(!r.width||!r.height) return;
  navX=clamp((((cx-r.left)/r.width)*2-1)*NAV_GAIN_X,-1,1);
  navY=clamp((((cy-r.top)/r.height)*2-1)*NAV_GAIN_Y,-1,1);
}
function navFrom(e){ navAt(e.clientX,e.clientY); }
function updateNav(){
  if(!touchNav) return;
  const tx=navX*PLAY, ty=navY*PLAY;
  input.x=clamp((tx-ship.x)/165,-1,1);
  input.y=clamp((ty-ship.y)/115,-1,1);   // commits harder vertically
}
view.addEventListener('pointerdown',e=>{ touchNav=true; navFrom(e);
  try{view.setPointerCapture(e.pointerId);}catch(_){}; e.preventDefault(); });
view.addEventListener('pointermove',e=>{ if(touchNav){ navFrom(e); e.preventDefault(); } });
const endNav=()=>{ touchNav=false; applyDir(); };
view.addEventListener('pointerup',endNav);
view.addEventListener('pointercancel',endNav);
/* iOS Safari holds back pointermove on a vertical drag while it works out whether you
   meant to scroll the page. Claiming the touch outright keeps up/down as instant as
   left/right. These must be non-passive for preventDefault to count. */
function navFromTouch(e){ const t=e.touches&&e.touches[0]; if(t) navAt(t.clientX,t.clientY); }
view.addEventListener('touchstart',e=>{ touchNav=true; navFromTouch(e); e.preventDefault(); },{passive:false});
view.addEventListener('touchmove',e=>{ if(touchNav) navFromTouch(e); e.preventDefault(); },{passive:false});
view.addEventListener('touchend',e=>{ endNav(); e.preventDefault(); },{passive:false});
view.addEventListener('touchcancel',endNav,{passive:false});
const track=$('thrTrack');
// horizontal throttle: swipe right for more speed
function setThr(e){ const r=track.getBoundingClientRect(); thr=clamp((e.clientX-r.left)/r.width,0,1); }
let thrDrag=false;
track.addEventListener('pointerdown',e=>{ thrDrag=true; setThr(e);
  try{track.setPointerCapture(e.pointerId);}catch(_){}; e.preventDefault(); });
track.addEventListener('pointermove',e=>{ if(thrDrag) setThr(e); });
track.addEventListener('pointerup',()=>{ thrDrag=false; });
track.addEventListener('pointercancel',()=>{ thrDrag=false; });
window.addEventListener('keydown',e=>{
  const k=e.key;
  if(k==='ArrowLeft'||k==='a'){ held.l=true; applyDir(); }
  if(k==='ArrowRight'||k==='d'){ held.r=true; applyDir(); }
  if(k==='ArrowUp'||k==='w'){ held.u=true; applyDir(); e.preventDefault(); }
  if(k==='ArrowDown'||k==='s'){ held.d=true; applyDir(); e.preventDefault(); }
  if(k==='='||k==='+'){ thr=clamp(thr+0.15,0,1); }
  if(k==='-'||k==='_'){ thr=clamp(thr-0.15,0,1); }
  if(k===' '){ thr=thr>0.5?0.2:1; e.preventDefault(); }
});
window.addEventListener('keyup',e=>{
  const k=e.key;
  if(k==='ArrowLeft'||k==='a'){ held.l=false; applyDir(); }
  if(k==='ArrowRight'||k==='d'){ held.r=false; applyDir(); }
  if(k==='ArrowUp'||k==='w'){ held.u=false; applyDir(); }
  if(k==='ArrowDown'||k==='s'){ held.d=false; applyDir(); }
});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ if(raf){ cancelAnimationFrame(raf); raf=null; } }
  else if(at('game')){ lastT=performance.now(); if(!raf) raf=requestAnimationFrame(loop); }
});

/* ================= buttons ================= */
let lastDiff=0;
document.querySelectorAll('.diff').forEach(b=>{ b.onclick=()=>{ if(!at('home')) return;
  lastDiff=+b.dataset.d; campaign=0; startLevel(0,lastDiff); }; });
$('howBtn').onclick=()=>{ if(!at('home')) return;
  alert("You are flying a rocket from the cockpit! 🚀\n\n• Put your finger anywhere on the window and the rocket flies to it — up, down, left, right, any direction. Slide your finger and it follows.\n• Swipe the ENGINE bar to the right to go faster, left to slow down. Faster gets you there sooner, but the rocks come at you much quicker.\n• Dodge everything: 🪨 space rock, ❄️ ice, 🛰️ satellite junk, ☄️ comets.\n• Grab the green ⛽ fuel cells — they sit right in the safe gap of each wave.\n• 10 hits and your rocket is wrecked.\n• A rival ship 👾 is racing you to the planet. Beat it!"); };
$('goBtn').onclick=()=>{ if(!at('brief')) return; launch(); };
$('briefHome').onclick=()=>{ if(!at('brief')) return; show('home'); $('bestHome').textContent=bestText(); };
$('gHome').onclick=()=>{ if(!at('game')) return; over=true; overHandled=true;
  if(raf){cancelAnimationFrame(raf); raf=null;} stopConfetti(); show('home'); $('bestHome').textContent=bestText(); };
$('nextBtn').onclick=()=>{ if(!at('result')) return; stopConfetti(); startLevel(Math.min(level+1,LEVELS.length-1),undefined); };
$('retryBtn').onclick=()=>{ if(!at('result')) return; stopConfetti(); startLevel(level,undefined); };
$('resHome').onclick=()=>{ if(!at('result')) return; stopConfetti(); show('home'); $('bestHome').textContent=bestText(); };
$('bestHome').textContent=bestText();
buildArt(); newGame(0,0); fitCanvas();

/* test hook */
window.__rocket={ LEVELS, DIFFS, MAX_HITS, PLAY, SHIP_R, FAR, HITZ,
  newGame, stepWorld, spawnWave, progress, rivalProgress, score_, buildArt,
  setRng:f=>{rng=f;},
  setInput:(x,y)=>{ input.x=x; input.y=y; },
  setThr:v=>{ thr=clamp(v,0,1); },
  go:()=>{ started=true; },
  navTo:(x,y)=>{ touchNav=true; navX=clamp(x,-1,1); navY=clamp(y,-1,1); },
  navEnd:()=>{ touchNav=false; input.x=0; input.y=0; },
  state:()=>({ship,obs,cells,travelled,spd,hits,fuel,score,raceT,over,outcome,stats,L,D,thr,
              rivalPos,started,level}),
  art:()=>ART };
})();
</script>
